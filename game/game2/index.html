<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooosimulation - Discord Game</title>
  <link rel="icon" type="image/png" href="../favicon2.png">

  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./PressStart2P-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
  </style>

  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      color: white;
      text-align: center;
      min-height: 100vh;
      background-color: #030712;
      background-image:
        radial-gradient(circle at 7% 12%, rgba(255,255,255,0.95) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 78%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 29% 25%, rgba(255,255,255,0.9) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 41% 66%, rgba(255,255,255,0.7) 0 1px, transparent 1.6px),
        radial-gradient(circle at 52% 14%, rgba(255,255,255,0.85) 0 1.3px, transparent 1.8px),
        radial-gradient(circle at 63% 82%, rgba(255,255,255,0.8) 0 1px, transparent 1.6px),
        radial-gradient(circle at 74% 31%, rgba(255,255,255,0.95) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 86% 58%, rgba(255,255,255,0.72) 0 1px, transparent 1.6px),
        radial-gradient(circle at 93% 17%, rgba(255,255,255,0.88) 0 1.1px, transparent 1.7px),
        radial-gradient(circle at 11% 50%, rgba(173,216,255,0.35) 0 2px, transparent 4px),
        radial-gradient(circle at 79% 9%, rgba(173,216,255,0.25) 0 2px, transparent 4px),
        radial-gradient(circle at 50% 50%, rgba(53, 80, 160, 0.18), transparent 55%),
        linear-gradient(to bottom, #02040a 0%, #081225 45%, #101a3a 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container { width: 100%; max-width: 550px; padding: 10px; position: relative; z-index: 2; }
    #gameWrapper { 
        width: 100%; max-width: 550px; 
        background-color: #000;
        border: 4px solid #FFF; 
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(255,255,255,0.15);
        overflow: hidden; 
        position: relative;
    }
    #gameContainer { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
    #titleBar { width: 100%; display: flex; justify-content: space-around; align-items: center; background-color: #000; padding: 15px 0; border-bottom: 2px solid #555; letter-spacing: 1px; }
    .title-left { font-size: 18px; color: #22CC44; text-shadow: 2px 2px 0 #000; } 
    .title-vs { font-size: 14px; color: #FFFFFF; }
    .title-right { font-size: 18px; color: #88CCFF; text-shadow: 2px 2px 0 #000; } 
    #gameCanvas { background-color: #000; display: block; width: 100%; height: auto; aspect-ratio: 1/1; cursor: crosshair; border: none; }
    
    #statusBar { width: 100%; height: 85px; padding: 10px; border-top: 2px solid #555; color: #FFF; text-align: center; display: flex; flex-direction: column; justify-content: center; line-height: 1.5; box-sizing: border-box; overflow: hidden; }
    .status-hp { font-size: 11px; margin-bottom: 5px; text-shadow: 1px 1px 0 #000; }
    .status-effects { font-size: 9px; color: #CCC; line-height: 1.4; word-break: keep-all; }
    
    #startOverlay { position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 115px); background-color: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
    .start-text { color: #FFF; font-size: 18px; text-align: center; line-height: 1.5; }
    .start-sub { color: #BBB; font-size: 12px; margin-top: 20px; text-align: center; }
    .controls-info { color: #AAFFAA; font-size: 12px; margin-top: 30px; line-height: 2; background-color: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; }
  </style>

  <script type="module">
    import { DiscordSDK } from "https://esm.sh/@discord/embedded-app-sdk";
    const discordSdk = new DiscordSDK("1495120151627173969");

    window.discordSdk = discordSdk;
    window.discordUserName = "Unknown Player";

    async function setupDiscord() {
      await discordSdk.ready();

      try {
        const instanceUser = discordSdk.instanceManager?.currentUser;
        if (instanceUser) {
          window.discordUserName = instanceUser.global_name || instanceUser.username || "Unknown Player";
        }
      } catch (e) {
        console.error("Failed to get Discord user from instanceManager", e);
      }
    }

    setupDiscord();
  </script>
</head>
<body>
  <div class="container">
    <div id="gameWrapper">
      <div id="gameContainer">
          <div id="titleBar">
              <div class="title-left">STICK (YOU)</div>
              <div class="title-vs">VS</div>
              <div class="title-right">CREEPER (CPU)</div>
          </div>
          <div id="startOverlay">
              <div class="start-text">CLICK TO START</div>
              <div class="start-sub">Stick VS Creeper</div>
              <div class="controls-info">[WASD]: Move<br><br>[J]: Auto-Charge Attack<br><br>[R]: Restart</div>
          </div>
          <canvas id="gameCanvas" width="550" height="550"></canvas>
          <div id="statusBar"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
    
    const loadImg = s => { let i = new Image(); i.src = "./" + s; return i; };
    const stickImg = loadImg("knockback stick.gif");
    
    const loadSnd = s => new Audio("./" + s);
    const chargeSound = loadSnd("spear charging.mp3"), hitSound = loadSnd("baseball.mp3"), swingSound = loadSnd("swing.mp3"), throwSound = loadSnd("through2.mp3"), breakSound = loadSnd("break2.mp3"), poisonSound = loadSnd("poison.mp3"), freezeSound = loadSnd("freeze.mp3");
    const readySound = loadSnd("ready.mp3"), fightSound = loadSnd("fight.mp3");
    const creeper1Snd = loadSnd("creeper1.mp3"); creeper1Snd.loop = true; 
    const creeper2Snd = loadSnd("creeper2.mp3");

    let isFontReady = false;
    document.fonts.ready.then(() => {
        isFontReady = true;
        renderGraphics();
    });

    let audioCtx;
    function playExternalSound(audioObj, vol) { if(!audioObj) return; let snd = audioObj.cloneNode(); snd.volume = vol; snd.play().catch(e => {}); }
    const playCustomSound = o => { if(o){ o.currentTime=0; o.play().catch(e=>{}); } };
    const stopCustomSound = o => { if(o){ o.pause(); o.currentTime=0; } };
    const playEffectSound = o => { if(o){ let c = o.cloneNode(true); c.volume=1.0; c.play().catch(e=>{}); } };
    const initAudio = () => { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

    function playSound(type) {
        if(!audioCtx) return null;
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), t = audioCtx.currentTime;
        const setS = (ty, f1, f2, g1, g2, d) => { osc.type=ty; osc.frequency.setValueAtTime(f1,t); osc.frequency.exponentialRampToValueAtTime(f2,t+d); gain.gain.setValueAtTime(g1,t); gain.gain.exponentialRampToValueAtTime(g2,t+d); };
        if(type==='hit') setS("sawtooth", 250, 50, 0.2, 0.01, 0.1);
        else if(type==='bounce') setS("sine", 200, 80, 0.05, 0.001, 0.1);
        else if(type==='heavyHit') setS("sawtooth", 120, 10, 0.5, 0.01, 0.4);
        else if(type==='death') setS("square", 100, 10, 0.3, 0.01, 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(t+0.5); return null;
    }

    const defaultSpeed = 2.5, MAX_HP = 100, COLLISION_DMG = 0.7; 
    let frameCount = 0, particles = [], projectiles = [], pools = [], hitStopTimer = 0, collisionCooldown = 0; 
    let isStarted = false, startDelayTimer = 250; 
    let animationId = null;

    let lastTime = 0;
    let accumulator = 0;
    const LOGIC_HZ = 165;
    const logicStep = 1000 / LOGIC_HZ;

    let isGameOver = false;
    let isWin = false;
    let gameStartTime = 0;
    let finalClearTime = 0;
    let unlockedAchievements = [];
    let hasSharedRecord = false;
    let shareStatusMessage = '';
    let shareStatusTimer = 0;
    let shareButtonBounds = null;

    const keys = { w: false, a: false, s: false, d: false };

    const formatTime = ms => {
        let t = Math.floor(ms);
        let m = Math.floor(t / 60000).toString().padStart(2, '0');
        let s = Math.floor((t % 60000) / 1000).toString().padStart(2, '0');
        let msPart = Math.floor((t % 1000) / 10).toString().padStart(2, '0');
        return `${m}:${s}.${msPart}`;
    };

    async function shareRecordToDiscord() {
  if (!isGameOver || !isWin || hasSharedRecord) return;
  
  hasSharedRecord = true;
  shareStatusMessage = "SHARING...";
  shareStatusTimer = 180;

  try {
    const response = await fetch('/api/submit-record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        gameName: 'Stick vs Creeper', // 👈 이 줄이 추가되었습니다!
        player: window.discordUserName || 'Unknown Player',
        clearTime: (finalClearTime / 1000).toFixed(2),
        matchup: 'Stick vs Creeper'
      })
    });

            const data = await response.json();

            if (data.ok) {
                shareStatusMessage = 'SHARED TO DISCORD!';
            } else {
                hasSharedRecord = false;
                shareStatusMessage = 'SHARE FAILED';
            }
        } catch (error) {
            hasSharedRecord = false;
            shareStatusMessage = 'SHARE FAILED';
            console.error(error);
        }

        shareStatusTimer = 240;
    }

    const spawnP = (x, y, c, sm, isD) => {
        let cnt = isD ? 50 : 20 * sm; if(isD) playSound('death');
        for(let i=0; i<cnt; i++) particles.push({ x, y, dx:(Math.random()-0.5)*(isD?15:12*sm), dy:(Math.random()-0.5)*(isD?15:12*sm), life:(isD?40:20)+Math.random()*(isD?30:15*sm), size:(Math.random()*(isD?6:4)+2)*sm, color:c||"#FFF" });
    };
    const createHitEffect = (x, y, c=null, sm=1) => spawnP(x,y,c,sm,false);
    const createDeathEffect = (x, y, c) => spawnP(x,y,c,1,true);

    class Ball {
        constructor(x, y, color, darkColor, isBlue) {
            this.x=x; this.y=y; this.isBlue=isBlue; this.dx=isBlue?-defaultSpeed:defaultSpeed; this.dy=(isBlue?-defaultSpeed:defaultSpeed)*0.8;
            this.radius=45; this.color=color; this.darkColor=darkColor; 
            this.hp = isBlue ? 300 : 100;
            this.isDead=false;
            this.electrifiedTimer=0; this.isPinned=false;
            this.angle=Math.atan2(this.dy,this.dx); this.angleToEnemy=0; this.isInvincible=false; this.weapon=null; this.stickState='idle'; this.stickTimer=0; this.stickAngleOffset=Math.PI/4; this.swingTrails=[]; this.freeHandLerp=0; this.isKnockedBack=false; this.bounceCount=0;
            this.poisonTimer=0; this.burnTimer=0; this.slowTimer=0; this.snowSlowTimer=0; this.freezeTimer=0; this.freezeAccum=0; this.activePoisonSound=null; this.activeFreezeSound=null;
            this.triggerAttack = false;
            this.invincibleTimer = 0; // 무적 타이머

            if (this.isBlue) {
                this.weapon = 'tnt';
                this.state = 'normal';
                this.fuseTimer = 0;
                this.fuseMaxTimer = 360;
                this.stopWaitTimer = 0;
                this.abilityCooldown = 300;
                this.pieces = [];
                this.explodeX = 0;
                this.explodeY = 0;
            }
        }
        
        explode(enemy, damage = 100) {
            creeper1Snd.pause(); creeper1Snd.currentTime = 0;
            creeper2Snd.currentTime = 0; creeper2Snd.play().catch(e => {});
            
            let maxDist = this.radius * 5; 

            for(let i=0; i<150; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 20 + 5; 
                let size = Math.random() * 30 + 15; 
                let rNum = Math.random();
                let pColor = rNum > 0.6 ? '#FF0000' : (rNum > 0.3 ? '#FFFFFF' : '#FF8800');
                let life = maxDist / speed; 
                particles.push({
                    x: this.x, y: this.y,
                    dx: Math.cos(angle)*speed, dy: Math.sin(angle)*speed,
                    life: life, size: size, color: pColor
                });
            }
            
            createHitEffect(this.x, this.y, "#FFFFFF", 5);

            let checkHit = (target) => {
                // 플레이어가 무적 상태(invincibleTimer > 0)일 경우 데미지 스킵
                if(!target || target.isDead || target.isInvincible || target.invincibleTimer > 0) return;
                let dist = Math.hypot(target.x - this.x, target.y - this.y);
                if (dist <= maxDist + target.radius) { 
                    let angle = Math.atan2(target.y - this.y, target.x - this.x);
                    target.isKnockedBack = true; target.bounceCount = 7;
                    target.hp -= damage;
                    target.dx = Math.cos(angle) * 35; 
                    target.dy = Math.sin(angle) * 35;
                    hitStopTimer = 25; 
                }
            };

            if (enemy) checkHit(enemy);

            this.state = 'split';
            this.explodeX = this.x; 
            this.explodeY = this.y;
            this.pieces = [];
            this.dx = 0;
            this.dy = 0;
            this.isKnockedBack = false;
            this.bounceCount = 0;
            
            let baseRotation = Math.random() * Math.PI * 2; 
            
            for(let i=0; i<4; i++) {
                let startAngle = baseRotation + (Math.PI / 2) * i;
                let endAngle = startAngle + (Math.PI / 2);
                let randomFlightAngle = Math.random() * Math.PI * 2; 
                let randomSpeed = defaultSpeed * (10 + Math.random() * 8); 

                this.pieces.push({
                    x: this.x, y: this.y,
                    dx: Math.cos(randomFlightAngle) * randomSpeed,
                    dy: Math.sin(randomFlightAngle) * randomSpeed,
                    radius: this.radius, 
                    startAngle: startAngle, endAngle: endAngle,
                    bounces: 0, rotation: 0 
                });
            }
        }

        updatePieces(enemy) {
            if (this.state === 'split') {
                let allStopped = true;
                for (let p of this.pieces) {
                    let speed = Math.hypot(p.dx, p.dy);
                    if (speed > 0.3) {
                        allStopped = false;
                        p.x += p.dx; p.y += p.dy;
                        p.rotation += speed * 0.03;

                        if (p.bounces >= 5) { p.dx *= 0.94; p.dy *= 0.94; } 
                        else { p.dx *= 0.99; p.dy *= 0.99; }
                        
                        let hitWall = false;
                        if (p.x + p.radius >= canvas.width) { p.x = canvas.width - p.radius; p.dx = -Math.abs(p.dx); hitWall = true;}
                        if (p.x - p.radius <= 0) { p.x = p.radius; p.dx = Math.abs(p.dx); hitWall = true;}
                        if (p.y + p.radius >= canvas.height) { p.y = canvas.height - p.radius; p.dy = -Math.abs(p.dy); hitWall = true;}
                        if (p.y - p.radius <= 0) { p.y = p.radius; p.dy = Math.abs(p.dy); hitWall = true;}
                        
                        if (hitWall) { playSound('bounce'); p.bounces++; }
                    } else {
                        p.dx = 0; p.dy = 0;
                    }
                }

                if (allStopped && this.pieces.length > 0) {
                    this.state = 'stopped';
                    this.stopWaitTimer = 180; 
                }
            } else if (this.state === 'stopped') {
                this.stopWaitTimer--;
                if (this.stopWaitTimer <= 0) this.state = 'returning';
            } else if (this.state === 'returning') {
                let allReturned = true;
                for (let p of this.pieces) {
                    let dx = this.explodeX - p.x;
                    let dy = this.explodeY - p.y;
                    let dist = Math.hypot(dx, dy);
                    
                    if (dist > 3) {
                        allReturned = false;
                        p.x += dx * 0.06; p.y += dy * 0.06;

                        let angleDiff = -p.rotation;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        p.rotation += angleDiff * 0.1;
                    } else {
                        p.x = this.explodeX; p.y = this.explodeY; p.rotation = 0;
                    }
                }
                
                if (allReturned) {
                    this.state = 'normal';
                    this.abilityCooldown = 720; 
                    this.x = this.explodeX; this.y = this.explodeY;
                    this.pieces = [];
                    createHitEffect(this.x, this.y, '#88CCFF', 3);
                }
            }
        }

        draw() {
            if(this.isDead) return;

            if (this.isBlue && (this.state === 'split' || this.state === 'stopped' || this.state === 'returning')) {
                for (let p of this.pieces) {
                    ctx.save(); 
                    ctx.translate(p.x, p.y); 
                    ctx.rotate(p.rotation); 
                    ctx.beginPath(); 
                    ctx.moveTo(0, 0); 
                    ctx.arc(0, 0, p.radius, p.startAngle, p.endAngle);
                    ctx.closePath();
                    ctx.fillStyle = this.color; 
                    ctx.fill(); 
                    ctx.lineWidth = 3; 
                    ctx.strokeStyle = this.darkColor; 
                    ctx.stroke(); 
                    ctx.restore();
                }
                return; // skip main ball render
            }

            let drawX = this.x;
            let drawY = this.y;
            let currentColor = this.color;
            let currentRadius = this.radius;

            if (this.isBlue && this.state === 'fusing') {
                ctx.save();
                ctx.beginPath();
                ctx.arc(drawX, drawY, this.radius * 5, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 68, 0, 0.15)";
                ctx.fill();
                ctx.restore();

                let progress = 1 - (this.fuseTimer / this.fuseMaxTimer);
                currentRadius = this.radius * (1 + 0.3 * progress);

                let shakeAmt = progress * 18; 
                drawX += (Math.random() - 0.5) * shakeAmt;
                drawY += (Math.random() - 0.5) * shakeAmt;
                
                let flashRate = Math.max(2, Math.floor(15 - progress * 13)); 
                if (frameCount % flashRate < flashRate / 2) {
                    currentColor = "#FFFFFF";
                }
            }

            if(this.weapon==='knockback_stick') {
                let bsa=this.angle+this.stickAngleOffset;
                for(let t of this.swingTrails) { 
                    ctx.save(); ctx.globalAlpha=(t.life/15)*0.4; ctx.translate(this.x,this.y); ctx.rotate(t.angle); ctx.translate(0,35); ctx.rotate(Math.PI/4); 
                    if (stickImg.complete && stickImg.naturalWidth > 0) ctx.drawImage(stickImg,5,-120,110,110); 
                    ctx.restore(); 
                }
                ctx.save(); ctx.translate(drawX, drawY); ctx.rotate(bsa); 
                if(this.stickState==='charging') {
                    let cr=this.stickTimer/180; ctx.shadowColor="#B040FF"; ctx.shadowBlur=15+cr*30; ctx.beginPath(); ctx.arc(80,35,15+Math.random()*25*cr,0,Math.PI*2); ctx.fillStyle=`rgba(180,50,255,${cr*0.8})`; ctx.fill(); ctx.lineWidth=2;
                    for(let i=0;i<5;i++) { let ea=Math.random()*Math.PI*2, ed=70-cr*50; ctx.beginPath(); ctx.moveTo(80+Math.cos(ea)*ed, 35+Math.sin(ea)*ed); ctx.lineTo(80,35); ctx.strokeStyle=`rgba(220,100,255,${Math.random()*cr})`; ctx.stroke(); }
                } else ctx.shadowBlur=0;
                ctx.save(); ctx.translate(0,35); ctx.rotate(Math.PI/4); 
                if (stickImg.complete && stickImg.naturalWidth > 0) ctx.drawImage(stickImg,5,-120,110,110); 
                ctx.restore();
                ctx.fillStyle=currentColor; ctx.strokeStyle=this.darkColor; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(45,35,12,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(45+(75-45)*this.freeHandLerp, -35+(35+35)*this.freeHandLerp, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore(); 
            }
            
            ctx.save(); ctx.translate(drawX, drawY); 
            if(this.poisonTimer>0) { ctx.shadowBlur=20; ctx.shadowColor="#4A0"; ctx.fillStyle="rgba(68,170,0,0.4)"; ctx.beginPath(); ctx.arc(0,0,currentRadius+6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
            
            // 무적 상태일 때 그려지는 황금색 실드
            if (this.invincibleTimer > 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, currentRadius + 10 + Math.sin(frameCount * 0.15) * 5, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(255, 215, 0, " + (0.5 + Math.sin(frameCount * 0.25)*0.5) + ")";
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.fillStyle = "rgba(255, 215, 0, 0.2)";
                ctx.fill();
                ctx.restore();
            }

            ctx.save(); ctx.rotate(this.angle); ctx.beginPath(); ctx.arc(0,0,currentRadius,0,Math.PI*2); ctx.fillStyle=currentColor; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=this.darkColor; ctx.stroke(); ctx.closePath();
            if(this.burnTimer>0 && frameCount%10<5) { ctx.fillStyle="rgba(255,136,0,0.4)"; ctx.beginPath(); ctx.arc(0,0,currentRadius,0,Math.PI*2); ctx.fill(); }
            
            ctx.rotate(-this.angle); ctx.font="14px 'Press Start 2P', cursive"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineWidth=3; ctx.strokeStyle="#000"; let dHp=Math.ceil(Math.max(this.hp,0)); ctx.strokeText(dHp,0,0); ctx.fillStyle="#FFF"; ctx.fillText(dHp,0,0); ctx.restore(); 
            ctx.restore(); 
            
            if(this.electrifiedTimer>0) {
                ctx.save(); ctx.translate(drawX, drawY); ctx.shadowBlur=15; ctx.shadowColor='#ffa'; ctx.strokeStyle='#fff';
                if(Math.random()>0.3) for(let i=0;i<4;i++) {
                    let ow=Math.random()*2+1, cx=(Math.random()-0.5)*currentRadius*1.8, cy=(Math.random()-0.5)*currentRadius*1.8, p=[{x:cx,y:cy}];
                    for(let j=0;j<3;j++){ cx+=(Math.random()-0.5)*40; cy+=(Math.random()-0.5)*40; p.push({x:cx,y:cy}); }
                    const dl = (w,c) => { ctx.beginPath(); ctx.lineWidth=w; ctx.strokeStyle=c; ctx.moveTo(p[0].x,p[0].y); for(let k=1;k<p.length;k++) ctx.lineTo(p[k].x,p[k].y); ctx.stroke(); };
                    dl(ow,'#fff'); dl(ow*0.45,'#ff0');
                }
                if(Math.random()>0.5){ ctx.globalCompositeOperation="lighter"; ctx.fillStyle="rgba(255,255,100,0.15)"; ctx.beginPath(); ctx.arc(0,0,currentRadius+Math.random()*15,0,Math.PI*2); ctx.fill(); } ctx.restore();
            }
            if(this.freezeTimer>0) {

    function handleBodyCollisions() {
        if (player2.weapon === 'tnt' && (player2.state === 'split' || player2.state === 'stopped' || player2.state === 'returning')) return;
        if(player1.isKnockedBack || player2.isKnockedBack) return;
        if(collisionCooldown>0) collisionCooldown--;
        if(!player1.isDead && !player2.isDead) {
            let dx=player2.x-player1.x, dy=player2.y-player1.y, d=Math.hypot(dx,dy)||1;
            if(d < player1.radius+player2.radius) {
                
                if (player2.weapon === 'tnt' && (player2.state === 'normal' || player2.state === 'fusing')) {
                    player2.explode(player1, 100); // 닿았을 때는 즉사(100 데미지)
                    return; 
                }

                let ov = player1.radius+player2.radius-d, nx=dx/d, ny=dy/d, m1=player1.freezeTimer>0?0.1:1, m2=player2.freezeTimer>0?0.1:1, tm=m1+m2;
                player1.x -= nx*ov*(m2/tm); player1.y -= ny*ov*(m2/tm); player2.x += nx*ov*(m1/tm); player2.y += ny*ov*(m1/tm);
                let van = (player1.dx-player2.dx)*nx + (player1.dy-player2.dy)*ny;
                if(van>0 && collisionCooldown===0) {
                    if(player1.freezeTimer<=0){player1.dx-=van*nx; player1.dy-=van*ny;} if(player2.freezeTimer<=0){player2.dx+=van*nx; player2.dy+=van*ny;}
                    // 무적 상태가 아닐 때만 몸통 박치기 데미지 적용
                    if(player1.invincibleTimer <= 0) { player1.hp-=COLLISION_DMG; createHitEffect(player1.x, player1.y); }
                    if(player2.invincibleTimer <= 0) { player2.hp-=COLLISION_DMG; createHitEffect(player2.x, player2.y); }
                    playSound('bounce'); collisionCooldown=5; 
                }
            }
        }
    }

        if(p.stickState==='cooldown') t.push(`<span style='color:#FFaa00'>[CD: ${Math.ceil((600-p.stickTimer)/60)}s]</span>`);
        
        if(p.weapon === 'tnt') {
            if(p.state==='fusing') t.push("<span style='color:#FF4400'>[FUSING]</span>");

    function updateLogic() {
        if(isStarted && startDelayTimer>0) { startDelayTimer--; if(startDelayTimer === 0) { gameStartTime = performance.now(); playCustomSound(fightSound); } return; }
        frameCount++;
        if (shareStatusTimer > 0) shareStatusTimer--;
        if(hitStopTimer>0) hitStopTimer--;

            for(let i=projectiles.length-1; i>=0; i--) { projectiles[i].update(); if(projectiles[i].isDead) projectiles.splice(i,1); }
            for(let i=pools.length-1; i>=0; i--) { pools[i].update(); if(pools[i].life<=0) pools.splice(i,1); }
            player1.update(player2); player2.update(player1); handleBodyCollisions();
        }
        for(let i=particles.length-1; i>=0; i--) { let p=particles[i]; p.x+=p.dx; p.y+=p.dy; p.life--; if(p.life<=0) particles.splice(i,1); }
        if ((player1.isDead || player2.isDead) && !isGameOver) {
            isGameOver = true; finalClearTime = performance.now() - gameStartTime; isWin = player2.isDead && !player1.isDead;

        if (k === 'j') {

            if (overlay && overlay.offsetParent !== null) { if (!isStarted) { overlay.style.display = "none"; isStarted = true; initAudio(); lastTime = performance.now(); startDelayTimer = 250; playCustomSound(readySound); if(!animationId) animationId = requestAnimationFrame(animate); } else { if(player1.stickState === 'idle' && !isGameOver) player1.triggerAttack = true; } }
            else if (isStarted) { if (!isGameOver && player1.stickState === 'idle') { player1.triggerAttack = true; } }
        }
        if (k === 'r' && isStarted) {
            resetGame();
        }
    });
    window.addEventListener('keyup', e => { let k = e.key.toLowerCase(); if(['w','a','s','d'].includes(k)) keys[k] = false; });
    document.getElementById("startOverlay").addEventListener('click', function(e) { if(!isStarted) { e.preventDefault(); this.style.display = "none"; isStarted = true; initAudio(); lastTime = performance.now(); startDelayTimer = 250; playCustomSound(readySound); if(!animationId) animationId = requestAnimationFrame(animate); } });
    
    canvas.addEventListener('click', (e) => {
        if (isStarted && isGameOver && isWin && shareButtonBounds && !hasSharedRecord) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;

            if (
                mx >= shareButtonBounds.x &&
                mx <= shareButtonBounds.x + shareButtonBounds.w &&
                my >= shareButtonBounds.y &&
                my <= shareButtonBounds.y + shareButtonBounds.h
            ) {
                shareRecordToDiscord();
                return;
            }
        }

        if (isStarted && isGameOver) {
            resetGame();
        }
    });
