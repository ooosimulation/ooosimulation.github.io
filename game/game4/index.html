<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stick VS Stick - Multiplayer</title>
  
  <!-- Socket.io 통신 모듈 (필수) -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0; font-family: 'Press Start 2P', cursive; color: white;
      background-color: #030712; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden;
      background-image: radial-gradient(circle at 50% 50%, rgba(53, 80, 160, 0.18), transparent 55%),
                        linear-gradient(to bottom, #02040a 0%, #081225 45%, #101a3a 100%);
    }

    #appContainer {
      position: relative; width: 100%; max-width: 550px; 
      height: 550px; /* 🌟 쪼그라들지 않게 높이를 550px로 고정! */
      background-color: #000; border: 4px solid #FFF; border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.15); overflow: hidden;
    }

    #titleBar {
      display: flex; justify-content: center; align-items: center;
      background-color: #000; padding: 15px 0; border-bottom: 2px solid #555;
    }
    .title-text { font-size: 16px; color: #88CCFF; text-shadow: 2px 2px 0 #000; }

    #gameCanvas {
      background-color: #000; display: none; width: 100%; height: auto; 
    }

    #lobbyScreen {
      position: absolute; top: 50px; left: 0; width: 100%; height: calc(100% - 50px);
      background-color: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; 
      align-items: center; justify-content: center; z-index: 20;
    }

    .box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; margin-bottom: 20px; width: 70%; text-align: center; }
    .btn { width: 100%; padding: 12px; font-family: inherit; font-size: 10px; cursor: pointer; transition: 0.2s; }
    .btn-create { border: 2px solid #88CCFF; background: #0b1a2a; color: #88CCFF; }
    .btn-join { border: 2px solid #22CC44; background: #0b2a12; color: #22CC44; }
    .input-code { width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #555; background: #111; color: #FFF; font-family: inherit; font-size: 12px; text-align: center; margin-bottom: 10px; text-transform: uppercase; }
  </style>
</head>
<body>

  <div id="appContainer">
    <div id="titleBar">
      <div class="title-text">STICK VS STICK</div>
    </div>
    
    <canvas id="gameCanvas" width="550" height="498"></canvas>

    <div id="lobbyScreen">
      <!-- Create Room -->
      <div class="box">
        <button id="btnCreate" class="btn btn-create">CREATE MATCH</button>
        <div id="createStatus" style="color: #FFD700; font-size: 10px; margin-top: 15px; line-height: 1.8; display: none;"></div>
      </div>

      <div style="color: #777; font-size: 10px; margin-bottom: 20px;">- OR -</div>

      <!-- Join Room -->
      <div class="box">
        <input id="inputRoomCode" class="input-code" type="text" maxlength="4" placeholder="4-DIGIT CODE">
        <button id="btnJoin" class="btn btn-join">JOIN MATCH</button>
        <div id="joinStatus" style="color: #FF5555; font-size: 9px; margin-top: 10px; display: none;"></div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 서버 주소를 자신의 ngrok 주소로 꼭 변경해 주세요!
    const socket = io("https://8e3f-115-21-98-171.ngrok-free.app", {
      extraHeaders: {
        "ngrok-skip-browser-warning": "true"
      }
    });

    let currentRoomCode = "";

    const btnCreate = document.getElementById('btnCreate');
    const createStatus = document.getElementById('createStatus');
    const btnJoin = document.getElementById('btnJoin');
    const inputRoomCode = document.getElementById('inputRoomCode');
    const joinStatus = document.getElementById('joinStatus');
    const lobbyScreen = document.getElementById('lobbyScreen');
    const gameCanvas = document.getElementById('gameCanvas');

    // [CREATE MATCH] 버튼 클릭 시
    btnCreate.addEventListener('click', () => {
      btnCreate.innerText = "CREATING...";
      socket.emit('createRoom'); 
    });

    // [JOIN MATCH] 버튼 클릭 시
    btnJoin.addEventListener('click', () => {
      const code = inputRoomCode.value.trim();
      if(code.length === 4) {
        btnJoin.innerText = "JOINING...";
        socket.emit('joinRoom', code);
      } else {
        joinStatus.innerText = "ENTER 4 DIGITS!";
        joinStatus.style.display = "block";
        btnJoin.innerText = "JOIN MATCH";
      }
    });
    
    // 1. 코드를 성공적으로 발급받았을 때
    socket.on('roomCreated', (roomCode) => {
      currentRoomCode = roomCode;
      createStatus.innerHTML = `ROOM CODE:<br><br><span style="color:#FFF; font-size:18px;">${roomCode}</span><br><br><span style="color:#AAA;">WAITING...</span>`;
      createStatus.style.display = "block";
      btnCreate.style.display = "none";
    });

    // 2. 방 입장에 실패했을 때
    socket.on('joinError', (errorMsg) => {
      joinStatus.innerText = errorMsg;
      joinStatus.style.display = "block";
      btnJoin.innerText = "JOIN MATCH";
    });

    // 3. 게임 시작 신호를 받았을 때
    socket.on('startGame', (data) => {
      console.log("매치 성사! 방 번호:", data.roomCode);
      
      lobbyScreen.style.display = "none";
      gameCanvas.style.display = "block";
      
      const ctx = gameCanvas.getContext("2d");
      ctx.fillStyle = "#22CC44";
      ctx.font = "20px 'Press Start 2P', cursive";
      ctx.textAlign = "center";
      ctx.fillText("GAME CONNECTED!", gameCanvas.width / 2, gameCanvas.height / 2);
    });
  </script>

</body>
</html>
