<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooosimulation - Multiplayer</title>
  
  <link rel="icon" type="image/png" href="../favicon2.png">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('../PressStart2P-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal;
    }

    body {
      margin: 0; font-family: 'Press Start 2P', cursive; color: white; text-align: center;
      min-height: 100vh; background-color: #030712;
      background-image:
        radial-gradient(circle at 7% 12%, rgba(255,255,255,0.95) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 78%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 50% 50%, rgba(53, 80, 160, 0.18), transparent 55%),
        linear-gradient(to bottom, #02040a 0%, #081225 45%, #101a3a 100%);
      background-attachment: fixed; overflow-x: hidden;
      display: flex; justify-content: center; align-items: center;
    }

    .container { width: 100%; max-width: 550px; padding: 10px; position: relative; z-index: 2; }
    #gameWrapper { 
      width: 100%; background-color: #000; border: 4px solid #FFF; 
      border-radius: 10px; box-shadow: 0 0 20px rgba(255,255,255,0.15);
      overflow: hidden; position: relative;
    }
    #gameContainer { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
    
    #titleBar { width: 100%; display: flex; justify-content: space-around; align-items: center; background-color: #000; padding: 15px 0; border-bottom: 2px solid #555; }
    .title-left { font-size: 18px; color: #22CC44; text-shadow: 2px 2px 0 #000; } 
    .title-vs { font-size: 14px; color: #FFFFFF; }
    .title-right { font-size: 18px; color: #88CCFF; text-shadow: 2px 2px 0 #000; } 
    
    #gameCanvas { background-color: #000; display: block; width: 100%; height: auto; aspect-ratio: 1/1; cursor: crosshair; }
    
    #statusBar { width: 100%; height: 85px; padding: 10px; border-top: 2px solid #555; color: #FFF; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
    .status-hp { font-size: 11px; margin-bottom: 5px; text-shadow: 1px 1px 0 #000; }
    .status-effects { font-size: 9px; color: #CCC; line-height: 1.4; word-break: keep-all; } 

    #lobbyScreen {
      position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 145px);
      background-color: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; 
      align-items: center; justify-content: center; z-index: 10;
    }
    .box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 70%; }
    .btn { width: 100%; padding: 12px; font-family: inherit; font-size: 10px; cursor: pointer; }
    .btn-create { border: 2px solid #88CCFF; background: #0b1a2a; color: #88CCFF; }
    .btn-join { border: 2px solid #22CC44; background: #0b2a12; color: #22CC44; }
    .input-code { width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #555; background: #111; color: #FFF; font-family: inherit; font-size: 12px; text-align: center; margin-bottom: 10px; text-transform: uppercase;}
  </style>

  <script type="module">
    import { DiscordSDK } from "https://esm.sh/@discord/embedded-app-sdk";
    const discordSdk = new DiscordSDK("1500187606929899620");

    window.discordSdk = discordSdk;
    window.discordUserName = "Unknown Player";

    async function setupDiscord() {
      await discordSdk.ready();
      try {
        const instanceUser = discordSdk.instanceManager?.currentUser;
        if (instanceUser) {
          window.discordUserName = instanceUser.global_name || instanceUser.username || "Unknown Player";
        }
      } catch (e) {
        console.error("Failed to get Discord user", e);
      }
    }
    setupDiscord();
  </script>
</head>
<body>

  <div class="container">
    <div id="gameWrapper">
      <div id="gameContainer">
          
          <div id="titleBar">
              <div class="title-left">STICK (P1)</div>
              <div class="title-vs">VS</div>
              <div class="title-right">STICK (P2)</div>
          </div>

          <div id="lobbyScreen">
            <div class="box">
              <button id="btnCreate" class="btn btn-create">CREATE MATCH</button>
              <div id="createStatus" style="color: #FFD700; font-size: 10px; margin-top: 15px; display: none;"></div>
            </div>
            <div style="color: #777; font-size: 10px; margin-bottom: 20px;">- OR -</div>
            <div class="box">
              <input id="inputRoomCode" class="input-code" type="text" maxlength="4" placeholder="4-DIGIT CODE">
              <button id="btnJoin" class="btn btn-join">JOIN MATCH</button>
              <div id="joinStatus" style="color: #FF5555; font-size: 9px; margin-top: 10px; display: none;"></div>
            </div>
          </div>

          <canvas id="gameCanvas" width="550" height="550"></canvas>
          
          <div id="statusBar">
            <div class="status-hp" id="uiStatusText">WAITING FOR MULTIPLAYER MATCH...</div>
          </div>

      </div>
    </div>
  </div>

  <script>
    // ⚠️ 자신의 ngrok 주소로 교체하세요!
    const socket = io("https://monkey-dream-elegant-september.trycloudflare.com", {
  path: "/socket.io"
}); 

    const btnCreate = document.getElementById('btnCreate');
    const createStatus = document.getElementById('createStatus');
    const btnJoin = document.getElementById('btnJoin');
    const inputRoomCode = document.getElementById('inputRoomCode');
    const joinStatus = document.getElementById('joinStatus');
    const lobbyScreen = document.getElementById('lobbyScreen');
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiStatusText = document.getElementById('uiStatusText');

    let audioCtx;
    const initAudio = () => { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

    function playSound(type) {
        if(!audioCtx) return null;
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), t = audioCtx.currentTime;
        const setS = (ty, f1, f2, g1, g2, d) => { osc.type=ty; osc.frequency.setValueAtTime(f1,t); osc.frequency.exponentialRampToValueAtTime(f2,t+d); gain.gain.setValueAtTime(g1,t); gain.gain.exponentialRampToValueAtTime(g2,t+d); };
        
        if(type==='bounce') setS("sine", 200, 80, 0.05, 0.001, 0.1);
        else if(type==='heavyHit') setS("sawtooth", 120, 10, 0.5, 0.01, 0.4); 
        else if(type==='death') setS("square", 100, 10, 0.3, 0.01, 0.5);
        else if(type==='dash') setS("sine", 600, 150, 0.2, 0.001, 0.25);
        
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(t+0.5); return null;
    }

    const loadSnd = s => new Audio("../" + s);
    const chargeSound = loadSnd("spear charging.mp3");
    const hitSound = loadSnd("baseball.mp3");
    const swingSound = loadSnd("swing.mp3");
    
    // 🌟 [추가됨] Ready, Fight 효과음 로드 (파일 경로에 해당 mp3가 있어야 합니다)
    const readySound = loadSnd("ready.mp3");
    const fightSound = loadSnd("fight.mp3");
    
    const playCustomSound = o => { if(o){ o.currentTime=0; o.play().catch(e=>{}); } };
    const stopCustomSound = o => { if(o){ o.pause(); o.currentTime=0; } };

    const stickImg = new Image(); 
    stickImg.src = "../knockback stick.gif";

    let particles = [];
    let hitStopTimer = 0;
    
    // 🌟 [추가/변경됨] 상태 변수 추가 (gamePhase, 투표 현황, Fight 텍스트 타이머)
    let isGameOver = false; 
    let gamePhase = 'waiting'; 
    let fightTextTimer = 0;
    let restartVotes = { p1: false, p2: false };
    let winnerText = "";

    const keys = { w: false, a: false, s: false, d: false };

    window.addEventListener('keydown', (e) => {
      let k = e.key.toLowerCase();
      if(['w','a','s','d'].includes(k)) { keys[k] = true; socket.emit('playerInput', keys); }
      if (k === 'j') { socket.emit('playerAction', 'attack'); }
      if (k === 'k') { socket.emit('playerAction', 'dash'); }
      // 🌟 [추가됨] R 키 입력 시 서버에 재시작 투표 요청 전송
      if (k === 'r') { socket.emit('requestRestart'); }
    });

    window.addEventListener('keyup', (e) => {
      let k = e.key.toLowerCase();
      if(['w','a','s','d'].includes(k)) { keys[k] = false; socket.emit('playerInput', keys); }
    });

    btnCreate.addEventListener('click', () => { btnCreate.innerText = "CREATING..."; socket.emit('createRoom'); initAudio(); });
    btnJoin.addEventListener('click', () => {
      initAudio();
      const code = inputRoomCode.value.trim();
      if(code.length === 4) { btnJoin.innerText = "JOINING..."; socket.emit('joinRoom', code); }
      else { joinStatus.innerText = "ENTER 4 DIGITS!"; joinStatus.style.display = "block"; }
    });

    socket.on('roomCreated', (roomCode) => {
      createStatus.innerHTML = `CODE: <span style="color:#FFF; font-size:16px;">${roomCode}</span><br><br>WAITING...`;
      createStatus.style.display = "block"; btnCreate.style.display = "none";
    });

    socket.on('joinError', (errorMsg) => {
      joinStatus.innerText = errorMsg; joinStatus.style.display = "block"; btnJoin.innerText = "JOIN MATCH";
    });

    socket.on('startGame', () => {
      lobbyScreen.style.display = "none"; 
      isGameOver = false;
    });

    // 🌟 [추가됨] Ready, Fight, 투표 상황 소켓 이벤트 수신
    socket.on('readyPhase', () => {
      initAudio();
      gamePhase = 'ready';
      isGameOver = false;
      restartVotes = { p1: false, p2: false };
      playCustomSound(readySound);
    });

    socket.on('fightPhase', () => {
      initAudio();
      gamePhase = 'playing';
      fightTextTimer = 60; // 약 1초(60프레임) 동안 FIGHT 글씨 표시
      playCustomSound(fightSound);
    });

    socket.on('voteUpdate', (votes) => {
      restartVotes = votes;
    });

    socket.on('playSound', (data) => {
      initAudio();
      if(data.type === 'charge') playCustomSound(chargeSound);
      if(data.type === 'swing') playCustomSound(swingSound);
      if(data.type === 'dash') playSound('dash');
    });

    socket.on('stopSound', (data) => {
      if(data.type === 'charge') stopCustomSound(chargeSound);
    });

    socket.on('playEffect', (data) => {
      initAudio();
      if (data.type === 'hit') {
        playCustomSound(hitSound); 
        hitStopTimer = 15; 
        for(let i=0; i<30; i++) particles.push({ x: data.x, y: data.y, dx: (Math.random()-0.5)*15, dy: (Math.random()-0.5)*15, life: 20+Math.random()*15, size: Math.random()*5+2, color: data.color });
      } 
      else if (data.type === 'heavyHit') {
        playSound('heavyHit'); 
        hitStopTimer = 10;
        for(let i=0; i<15; i++) particles.push({ x: data.x, y: data.y, dx: (Math.random()-0.5)*8, dy: (Math.random()-0.5)*8, life: 15+Math.random()*10, size: Math.random()*3+2, color: data.color });
      }
      else if (data.type === 'death') {
        playSound('death');
        hitStopTimer = 30; 
        for(let i=0; i<60; i++) particles.push({ x: data.x, y: data.y, dx: (Math.random()-0.5)*20, dy: (Math.random()-0.5)*20, life: 30+Math.random()*30, size: Math.random()*6+3, color: data.color });
      }
    });

    socket.on('gameOver', (data) => {
      isGameOver = true;
      gamePhase = 'gameover'; // 🌟 상태 전환 추가
      winnerText = data.winner;
    });

    const getTags = p => {
        if(p.isDead) return "<span style='color:#555'>[DEAD]</span>"; 
        let t=[];
        if(p.stickState === 'charging') t.push("<span style='color:#FF5555'>[CHARGING]</span>");
        
        if(p.stickState === 'cooldown') t.push(`<span style='color:#FFaa00'>[ATK CD: ${Math.ceil((600-p.stickTimer)/60)}s]</span>`);
        
        if(p.dashCooldown > 0) t.push(`<span style='color:#00FFFF'>[DASH CD: ${Math.ceil(p.dashCooldown/60)}s]</span>`);
        
        if(p.isKnockedBack) t.push(`<span style='color:#FF0000'>[FLYING: ${p.bounceCount}]</span>`);
        return t.length ? t.join(" ") : "<span style='color:#555'>[NORMAL]</span>";
    };

    socket.on('gameState', (state) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let hp1 = Math.ceil(Math.max(0, state.p1.hp));
      let hp2 = Math.ceil(Math.max(0, state.p2.hp));
      document.getElementById("statusBar").innerHTML = `<div class="status-hp">P1 HP: ${hp1} &nbsp;&nbsp;|&nbsp;&nbsp; P2 HP: ${hp2}</div><div class="status-effects">P1: ${getTags(state.p1)} &nbsp;&nbsp;|&nbsp;&nbsp; P2: ${getTags(state.p2)}</div>`;

      ctx.save();
      if(hitStopTimer > 0) { 
        hitStopTimer--; 
        let sa = Math.min(hitStopTimer, 12) * 0.8; 
        ctx.translate((Math.random()-0.5)*sa, (Math.random()-0.5)*sa); 
      }

      for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.dx; p.y += p.dy; p.life--;
        if(p.life <= 0) particles.splice(i, 1);
        else {
          ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.size*(p.life/30)), 0, Math.PI*2); 
          ctx.fillStyle = p.color; ctx.fill(); ctx.closePath();
        }
      }

      const drawBall = (ball) => {
        if (ball.isDead) return;

        ctx.save();
        ctx.translate(ball.x, ball.y);

        if (ball.isDashing) {
          ctx.save();
          for (let i = 1; i <= 4; i++) {
            ctx.globalAlpha = 0.5 - (i * 0.1); 
            let trailX = -Math.cos(ball.angle) * (18 * i);
            let trailY = -Math.sin(ball.angle) * (18 * i);
            
            ctx.beginPath(); 
            ctx.arc(trailX, trailY, 45, 0, Math.PI * 2); 
            ctx.fillStyle = ball.color; 
            ctx.fill(); 
          }
          ctx.restore();
        }

        let bsa = ball.angle + ball.stickAngleOffset;
        ctx.save(); ctx.rotate(bsa); 
        
        if(ball.stickState === 'charging') {
          let cr = ball.stickTimer / 180; 
          ctx.shadowColor = "#B040FF"; ctx.shadowBlur = 15 + cr * 30; 
          ctx.beginPath(); ctx.arc(80, 35, 15 + Math.random() * 25 * cr, 0, Math.PI * 2); 
          ctx.fillStyle = `rgba(180,50,255,${cr * 0.8})`; ctx.fill(); ctx.lineWidth = 2;
          for(let i=0; i<5; i++) { 
            let ea = Math.random() * Math.PI * 2, ed = 70 - cr * 50; 
            ctx.beginPath(); ctx.moveTo(80 + Math.cos(ea) * ed, 35 + Math.sin(ea) * ed); ctx.lineTo(80, 35); 
            ctx.strokeStyle = `rgba(220,100,255,${Math.random() * cr})`; ctx.stroke(); 
          }
        } else { ctx.shadowBlur = 0; }

        ctx.save(); ctx.translate(0, 35); ctx.rotate(Math.PI / 4); 
        if (stickImg.complete && stickImg.naturalWidth > 0) ctx.drawImage(stickImg, 5, -120, 110, 110); 
        ctx.restore();

        let freeHandLerp = ball.stickState === 'charging' ? Math.min(1, ball.stickTimer / 180) : 0;
        ctx.fillStyle = ball.color; ctx.strokeStyle = ball.darkColor; ctx.lineWidth = 3; 
        ctx.beginPath(); ctx.arc(45, 35, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
        ctx.beginPath(); ctx.arc(45 + (75 - 45) * freeHandLerp, -35 + (35 + 35) * freeHandLerp, 12, 0, Math.PI * 2); 
        ctx.fill(); ctx.stroke(); 
        ctx.restore(); 

        ctx.rotate(ball.angle); ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); 
        ctx.fillStyle = ball.color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = ball.darkColor; ctx.stroke(); ctx.closePath();
        
        ctx.rotate(-ball.angle); 
        ctx.font="14px 'Press Start 2P', cursive"; 
        ctx.textAlign="center"; 
        ctx.textBaseline="middle"; 
        ctx.lineWidth=3; 
        ctx.strokeStyle="#000"; 
        let dHp=Math.ceil(Math.max(ball.hp,0)); 
        ctx.strokeText(dHp,0,0); 
        ctx.fillStyle="#FFF"; 
        ctx.fillText(dHp,0,0);

        ctx.restore();
      };

      drawBall(state.p1);
      drawBall(state.p2);
      ctx.restore(); 

      // 🌟 [추가/변경됨] 화면 위에 그리는 UI 로직 추가
      if (gamePhase === 'ready') {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FFD700"; ctx.font = "30px 'Press Start 2P', cursive"; ctx.textAlign = "center";
        ctx.fillText("READY...", canvas.width/2, canvas.height/2);
      }

      if (gamePhase === 'playing' && fightTextTimer > 0) {
        fightTextTimer--;
        ctx.fillStyle = "#FF0000"; ctx.font = "45px 'Press Start 2P', cursive"; ctx.textAlign = "center";
        ctx.fillText("FIGHT!", canvas.width/2, canvas.height/2);
      }

      // 🌟 [변경됨] 기존 isGameOver 블록을 투표 UI가 포함된 gameover 페이즈 블록으로 변경
      if (gamePhase === 'gameover') {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#FFF"; ctx.font = "30px 'Press Start 2P', cursive"; ctx.textAlign = "center";
        ctx.fillText("WINNER:", canvas.width/2, canvas.height/2 - 50);
        
        ctx.fillStyle = winnerText.includes('GREEN') ? "#22CC44" : "#88CCFF";
        ctx.fillText(winnerText, canvas.width/2, canvas.height/2);
        
        // 투표 안내 문구
        ctx.font = "12px 'Press Start 2P', cursive"; ctx.fillStyle = "#AAA";
        ctx.fillText("PRESS 'R' TO REMATCH", canvas.width/2, canvas.height/2 + 60);

        // 각 플레이어 투표 현황 렌더링
        let p1VoteText = restartVotes.p1 ? "[P1: READY]" : "[P1: WAIT]";
        let p2VoteText = restartVotes.p2 ? "[P2: READY]" : "[P2: WAIT]";
        
        ctx.fillStyle = restartVotes.p1 ? "#22CC44" : "#555";
        ctx.fillText(p1VoteText, canvas.width/2 - 80, canvas.height/2 + 100);
        
        ctx.fillStyle = restartVotes.p2 ? "#88CCFF" : "#555";
        ctx.fillText(p2VoteText, canvas.width/2 + 80, canvas.height/2 + 100);
      }
    });
  </script>
</body>
</html>
