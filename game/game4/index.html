<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooosimulation - Multiplayer</title>
  
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <!-- 🌟 오리지널 폰트 세팅 -->
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('../PressStart2P-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal;
    }
  </style>

  <!-- 🌟 오리지널 디자인 (우주 배경, 컨테이너, UI) 완벽 복원 -->
  <style>
    body {
      margin: 0; font-family: 'Press Start 2P', cursive; color: white; text-align: center;
      min-height: 100vh; background-color: #030712;
      background-image:
        radial-gradient(circle at 7% 12%, rgba(255,255,255,0.95) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 78%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 50% 50%, rgba(53, 80, 160, 0.18), transparent 55%),
        linear-gradient(to bottom, #02040a 0%, #081225 45%, #101a3a 100%);
      background-attachment: fixed; overflow-x: hidden;
      display: flex; justify-content: center; align-items: center;
    }

    .container { width: 100%; max-width: 550px; padding: 10px; position: relative; z-index: 2; }
    #gameWrapper { 
      width: 100%; background-color: #000; border: 4px solid #FFF; 
      border-radius: 10px; box-shadow: 0 0 20px rgba(255,255,255,0.15);
      overflow: hidden; position: relative;
    }
    #gameContainer { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
    
    #titleBar { width: 100%; display: flex; justify-content: space-around; align-items: center; background-color: #000; padding: 15px 0; border-bottom: 2px solid #555; }
    .title-left { font-size: 18px; color: #22CC44; text-shadow: 2px 2px 0 #000; } 
    .title-vs { font-size: 14px; color: #FFFFFF; }
    .title-right { font-size: 18px; color: #88CCFF; text-shadow: 2px 2px 0 #000; } 
    
    #gameCanvas { background-color: #000; display: block; width: 100%; height: auto; aspect-ratio: 1/1; cursor: crosshair; }
    
    #statusBar { width: 100%; height: 85px; padding: 10px; border-top: 2px solid #555; color: #FFF; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
    .status-hp { font-size: 11px; margin-bottom: 5px; text-shadow: 1px 1px 0 #000; }

    /* 대기실 오버레이 */
    #lobbyScreen {
      position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 145px);
      background-color: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; 
      align-items: center; justify-content: center; z-index: 10;
    }
    .box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; width: 70%; }
    .btn { width: 100%; padding: 12px; font-family: inherit; font-size: 10px; cursor: pointer; }
    .btn-create { border: 2px solid #88CCFF; background: #0b1a2a; color: #88CCFF; }
    .btn-join { border: 2px solid #22CC44; background: #0b2a12; color: #22CC44; }
    .input-code { width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #555; background: #111; color: #FFF; font-family: inherit; font-size: 12px; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div id="gameWrapper">
      <div id="gameContainer">
          
          <!-- 오리지널 타이틀 바 -->
          <div id="titleBar">
              <div class="title-left">STICK (P1)</div>
              <div class="title-vs">VS</div>
              <div class="title-right">STICK (P2)</div>
          </div>

          <!-- 로비 화면 -->
          <div id="lobbyScreen">
            <div class="box">
              <button id="btnCreate" class="btn btn-create">CREATE MATCH</button>
              <div id="createStatus" style="color: #FFD700; font-size: 10px; margin-top: 15px; display: none;"></div>
            </div>
            <div style="color: #777; font-size: 10px; margin-bottom: 20px;">- OR -</div>
            <div class="box">
              <input id="inputRoomCode" class="input-code" type="text" maxlength="4" placeholder="4-DIGIT CODE">
              <button id="btnJoin" class="btn btn-join">JOIN MATCH</button>
              <div id="joinStatus" style="color: #FF5555; font-size: 9px; margin-top: 10px; display: none;"></div>
            </div>
          </div>

          <!-- 게임 캔버스 -->
          <canvas id="gameCanvas" width="550" height="550"></canvas>
          
          <!-- 오리지널 상태 표시줄 -->
          <div id="statusBar">
            <div class="status-hp" id="uiStatusText">WAITING FOR MULTIPLAYER MATCH...</div>
          </div>

      </div>
    </div>
  </div>

  <script>
    // ⚠️ 자신의 ngrok 주소로 교체하세요!
    const socket = io("https://8e3f-115-21-98-171.ngrok-free.app", {
      extraHeaders: { "ngrok-skip-browser-warning": "true" }
    }); 

    const btnCreate = document.getElementById('btnCreate');
    const createStatus = document.getElementById('createStatus');
    const btnJoin = document.getElementById('btnJoin');
    const inputRoomCode = document.getElementById('inputRoomCode');
    const joinStatus = document.getElementById('joinStatus');
    const lobbyScreen = document.getElementById('lobbyScreen');
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiStatusText = document.getElementById('uiStatusText');

    // 🌟 오리지널 막대기 이미지 불러오기 (경로가 ../ 인 것을 가정)
    const stickImg = new Image(); 
    stickImg.src = "../knockback stick.gif";

    const keys = { w: false, a: false, s: false, d: false };

    // --- 키보드 이벤트 ---
    window.addEventListener('keydown', (e) => {
      let k = e.key.toLowerCase();
      if(['w','a','s','d'].includes(k)) {
        keys[k] = true;
        socket.emit('playerInput', keys);
      }
      // 🌟 J키를 누르면 서버로 'attack' 신호를 보냅니다!
      if (k === 'j') {
        socket.emit('playerAction', 'attack');
      }
    });

    window.addEventListener('keyup', (e) => {
      let k = e.key.toLowerCase();
      if(['w','a','s','d'].includes(k)) {
        keys[k] = false;
        socket.emit('playerInput', keys);
      }
    });

    // --- 버튼 이벤트 ---
    btnCreate.addEventListener('click', () => {
      btnCreate.innerText = "CREATING..."; socket.emit('createRoom'); 
    });

    btnJoin.addEventListener('click', () => {
      const code = inputRoomCode.value.trim();
      if(code.length === 4) {
        btnJoin.innerText = "JOINING..."; socket.emit('joinRoom', code);
      } else {
        joinStatus.innerText = "ENTER 4 DIGITS!"; joinStatus.style.display = "block";
      }
    });

    // --- 소켓 이벤트 ---
    socket.on('roomCreated', (roomCode) => {
      createStatus.innerHTML = `CODE: <span style="color:#FFF; font-size:16px;">${roomCode}</span><br><br>WAITING...`;
      createStatus.style.display = "block"; btnCreate.style.display = "none";
    });

    socket.on('joinError', (errorMsg) => {
      joinStatus.innerText = errorMsg; joinStatus.style.display = "block"; btnJoin.innerText = "JOIN MATCH";
    });

    socket.on('startGame', () => {
      lobbyScreen.style.display = "none"; 
      uiStatusText.innerHTML = `P1 HP: 100 &nbsp;&nbsp;|&nbsp;&nbsp; P2 HP: 100`; 
    });

    // 🌟 서버에서 온 정답을 바탕으로 캔버스에 그리기 (오리지널 비주얼 완전 복구)
    socket.on('gameState', (state) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const drawBall = (ball) => {
        ctx.save();
        ctx.translate(ball.x, ball.y);

        // 1. 넉백 스틱 그리기
        let bsa = ball.angle + ball.stickAngleOffset;
        
        ctx.save(); 
        ctx.rotate(bsa); 
        
        // 차징 이펙트
        if(ball.stickState === 'charging') {
          let cr = ball.stickTimer / 65; 
          ctx.shadowColor = "#B040FF"; ctx.shadowBlur = 15 + cr * 30; 
          ctx.beginPath(); ctx.arc(80, 35, 15 + Math.random() * 25 * cr, 0, Math.PI * 2); 
          ctx.fillStyle = `rgba(180,50,255,${cr * 0.8})`; ctx.fill(); ctx.lineWidth = 2;
          for(let i=0; i<5; i++) { 
            let ea = Math.random() * Math.PI * 2, ed = 70 - cr * 50; 
            ctx.beginPath(); ctx.moveTo(80 + Math.cos(ea) * ed, 35 + Math.sin(ea) * ed); ctx.lineTo(80, 35); 
            ctx.strokeStyle = `rgba(220,100,255,${Math.random() * cr})`; ctx.stroke(); 
          }
        } else { ctx.shadowBlur = 0; }

        // 스틱 이미지 렌더링
        ctx.save(); 
        ctx.translate(0, 35); 
        ctx.rotate(Math.PI / 4); 
        if (stickImg.complete && stickImg.naturalWidth > 0) ctx.drawImage(stickImg, 5, -120, 110, 110); 
        ctx.restore();

        // 양손 그리기
        let freeHandLerp = ball.stickState === 'charging' ? Math.min(1, ball.stickTimer / 65) : 0;
        ctx.fillStyle = ball.color; 
        ctx.strokeStyle = ball.darkColor; 
        ctx.lineWidth = 3; 
        ctx.beginPath(); ctx.arc(45, 35, 12, 0, Math.PI * 2); // 오른손
        ctx.fill(); ctx.stroke(); 
        ctx.beginPath(); ctx.arc(45 + (75 - 45) * freeHandLerp, -35 + (35 + 35) * freeHandLerp, 12, 0, Math.PI * 2); // 왼손
        ctx.fill(); ctx.stroke(); 
        ctx.restore(); 

        // 2. 몸통(공) 그리기
        ctx.rotate(ball.angle); 
        ctx.beginPath(); 
        ctx.arc(0, 0, 45, 0, Math.PI * 2); 
        ctx.fillStyle = ball.color; 
        ctx.fill(); 
        ctx.lineWidth = 3; 
        ctx.strokeStyle = ball.darkColor; 
        ctx.stroke(); 
        ctx.closePath();
        
        ctx.restore();
      };

      drawBall(state.p1);
      drawBall(state.p2);
    });

  </script>
</body>
</html>
