<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooosimulation - Discord Game</title>
  <link rel="icon" type="image/png" href="../favicon2.png">

  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./PressStart2P-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
  </style>

  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      color: white;
      text-align: center;
      min-height: 100vh;
      background-color: #030712;
      background-image:
        radial-gradient(circle at 7% 12%, rgba(255,255,255,0.95) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 78%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 29% 25%, rgba(255,255,255,0.9) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 41% 66%, rgba(255,255,255,0.7) 0 1px, transparent 1.6px),
        radial-gradient(circle at 52% 14%, rgba(255,255,255,0.85) 0 1.3px, transparent 1.8px),
        radial-gradient(circle at 63% 82%, rgba(255,255,255,0.8) 0 1px, transparent 1.6px),
        radial-gradient(circle at 74% 31%, rgba(255,255,255,0.95) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 86% 58%, rgba(255,255,255,0.72) 0 1px, transparent 1.6px),
        radial-gradient(circle at 93% 17%, rgba(255,255,255,0.88) 0 1.1px, transparent 1.7px),
        radial-gradient(circle at 11% 50%, rgba(173,216,255,0.35) 0 2px, transparent 4px),
        radial-gradient(circle at 79% 9%, rgba(173,216,255,0.25) 0 2px, transparent 4px),
        radial-gradient(circle at 50% 50%, rgba(53, 80, 160, 0.18), transparent 55%),
        linear-gradient(to bottom, #02040a 0%, #081225 45%, #101a3a 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container { width: 100%; max-width: 550px; padding: 10px; position: relative; z-index: 2; }
    #gameWrapper { 
        width: 100%; max-width: 550px; 
        background-color: #000;
        border: 4px solid #FFF; 
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(255,255,255,0.15);
        overflow: hidden; 
        position: relative;
    }
    #gameContainer { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
    #titleBar { width: 100%; display: flex; justify-content: space-around; align-items: center; background-color: #000; padding: 15px 0; border-bottom: 2px solid #555; letter-spacing: 1px; }
    .title-left { font-size: 18px; color: #22CC44; text-shadow: 2px 2px 0 #000; } 
    .title-vs { font-size: 14px; color: #FFFFFF; }
    .title-right { font-size: 18px; color: #88CCFF; text-shadow: 2px 2px 0 #000; } 
    #gameCanvas { background-color: #000; display: block; width: 100%; height: auto; aspect-ratio: 1/1; cursor: crosshair; border: none; }
    #statusBar { width: 100%; padding: 15px 10px 10px; border-top: 2px solid #555; color: #FFF; text-align: center; display: flex; flex-direction: column; line-height: 1.5; box-sizing: border-box; }
    .status-hp { font-size: 11px; margin-bottom: 5px; text-shadow: 1px 1px 0 #000; }
    .status-effects { font-size: 9px; color: #CCC; }
    #startOverlay { position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 115px); background-color: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
    .start-text { color: #FFF; font-size: 18px; text-align: center; line-height: 1.5; }
    .start-sub { color: #BBB; font-size: 12px; margin-top: 20px; text-align: center; }
    .controls-info { color: #AAFFAA; font-size: 12px; margin-top: 30px; line-height: 2; background-color: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; }
  </style>

  <script type="module">
    import { DiscordSDK } from "https://esm.sh/@discord/embedded-app-sdk";
    const discordSdk = new DiscordSDK("1492558716027797574");

    window.discordSdk = discordSdk;
    window.discordUserName = "Unknown Player";

    async function setupDiscord() {
      await discordSdk.ready();

      try {
        const instanceUser = discordSdk.instanceManager?.currentUser;
        if (instanceUser) {
          window.discordUserName = instanceUser.global_name || instanceUser.username || "Unknown Player";
        }
      } catch (e) {
        console.error("Failed to get Discord user from instanceManager", e);
      }
    }

    setupDiscord();
  </script>
</head>
<body>
  <div class="container">
    <div id="gameWrapper">
      <div id="gameContainer">
          <div id="titleBar">
              <div class="title-left">STICK (YOU)</div>
              <div class="title-vs">VS</div>
              <div class="title-right">ANGLER (CPU)</div>
          </div>
          <div id="startOverlay">
              <div class="start-text">CLICK TO START</div>
              <div class="start-sub">Stick VS Angler</div>
              <div class="controls-info">[WASD]: Move<br><br>[J]: Auto-Charge Attack</div>
          </div>
          <canvas id="gameCanvas" width="550" height="550"></canvas>
          <div id="statusBar"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
    
    const loadImg = s => { let i = new Image(); i.src = "../" + s; return i; };
    const stickImg = loadImg("knockback stick.gif"), fishBucketImg = loadImg('fish bucket.png'), snowImg = loadImg('snow.png'), lavaImg = loadImg('lava.png');
    const fishingImg = loadImg('fishing.png'), fishing2Img = loadImg('fishing2.png');
    
    const loadSnd = s => new Audio("../" + s);
    const chargeSound = loadSnd("spear charging.mp3"), hitSound = loadSnd("baseball.mp3"), swingSound = loadSnd("swing.mp3"), throwSound = loadSnd("through2.mp3"), breakSound = loadSnd("break2.mp3"), poisonSound = loadSnd("poison.mp3"), freezeSound = loadSnd("freeze.mp3");
    const anglerMp3 = loadSnd('angler.mp3'), readySound = loadSnd("ready.mp3"), fightSound = loadSnd("fight.mp3");

    let isFontReady = false;
    document.fonts.ready.then(() => {
        isFontReady = true;
        renderGraphics();
    });

    let audioCtx;
    function playExternalSound(audioObj, vol) { if(!audioObj) return; let snd = audioObj.cloneNode(); snd.volume = vol; snd.play().catch(e => {}); }
    const playCustomSound = o => { if(o){ o.currentTime=0; o.play().catch(e=>{}); } };
    const stopCustomSound = o => { if(o){ o.pause(); o.currentTime=0; } };
    const playEffectSound = o => { if(o){ let c = o.cloneNode(true); c.volume=1.0; c.play().catch(e=>{}); } };
    const initAudio = () => { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

    function playSound(type) {
        if(!audioCtx) return null;
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), t = audioCtx.currentTime;
        const setS = (ty, f1, f2, g1, g2, d) => { osc.type=ty; osc.frequency.setValueAtTime(f1,t); osc.frequency.exponentialRampToValueAtTime(f2,t+d); gain.gain.setValueAtTime(g1,t); gain.gain.exponentialRampToValueAtTime(g2,t+d); };
        if(type==='hit') setS("sawtooth", 250, 50, 0.2, 0.01, 0.1);
        else if(type==='bounce') setS("sine", 200, 80, 0.05, 0.001, 0.1);
        else if(type==='heavyHit') setS("sawtooth", 120, 10, 0.5, 0.01, 0.4);
        else if(type==='death') setS("square", 100, 10, 0.3, 0.01, 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(t+0.5); return null;
    }

    const defaultSpeed = 2.5, MAX_HP = 100, COLLISION_DMG = 0.7; 
    let frameCount = 0, particles = [], projectiles = [], pools = [], hitStopTimer = 0, collisionCooldown = 0; 
    let isStarted = false, startDelayTimer = 250; 
    let animationId = null;

    let lastTime = 0;
    let accumulator = 0;
    const LOGIC_HZ = 165;
    const logicStep = 1000 / LOGIC_HZ;

    let isGameOver = false;
    let isWin = false;
    let gameStartTime = 0;
    let finalClearTime = 0;
    let unlockedAchievements = [];
    let hasSharedRecord = false;
    let shareStatusMessage = '';
    let shareStatusTimer = 0;
    let shareButtonBounds = null;

    const keys = { w: false, a: false, s: false, d: false };

    const formatTime = ms => {
        let t = Math.floor(ms);
        let m = Math.floor(t / 60000).toString().padStart(2, '0');
        let s = Math.floor((t % 60000) / 1000).toString().padStart(2, '0');
        let msPart = Math.floor((t % 1000) / 10).toString().padStart(2, '0');
        return `${m}:${s}.${msPart}`;
    };

    async function shareRecordToDiscord() {
        if (!isGameOver || !isWin || hasSharedRecord) return;

        hasSharedRecord = true;
        shareStatusMessage = 'SHARING...';
        shareStatusTimer = 180;

        try {
            const response = await fetch(/api/submit-record', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    player: window.discordUserName || 'Unknown Player',
                    clearTime: (finalClearTime / 1000).toFixed(2),
                    matchup: 'Stick vs Angler'
                })
            });

            const data = await response.json();

            if (data.ok) {
                shareStatusMessage = 'SHARED TO DISCORD!';
            } else {
                hasSharedRecord = false;
                shareStatusMessage = 'SHARE FAILED';
            }
        } catch (error) {
            hasSharedRecord = false;
            shareStatusMessage = 'SHARE FAILED';
            console.error(error);
        }

        shareStatusTimer = 240;
    }

    const spawnP = (x, y, c, sm, isD) => {
        let cnt = isD ? 50 : 20 * sm; if(isD) playSound('death');
        for(let i=0; i<cnt; i++) particles.push({ x, y, dx:(Math.random()-0.5)*(isD?15:12*sm), dy:(Math.random()-0.5)*(isD?15:12*sm), life:(isD?40:20)+Math.random()*(isD?30:15*sm), size:(Math.random()*(isD?6:4)+2)*sm, color:c||"#FFF" });
    };
    const createHitEffect = (x, y, c=null, sm=1) => spawnP(x,y,c,sm,false);
    const createDeathEffect = (x, y, c) => spawnP(x,y,c,1,true);

    class BucketProjectile {
        constructor(sx,sy,tx,ty,t,tye) { this.x=sx; this.y=sy; this.targetX=tx; this.targetY=ty; this.targetEnemy=t; this.type=tye; let a=Math.atan2(ty-sy,tx-sx); this.speed=5; this.dx=Math.cos(a)*5; this.dy=Math.sin(a)*5; this.spin=0; this.isDead=false; }
        update() { this.x+=this.dx; this.y+=this.dy; this.spin+=0.2; if(Math.hypot(this.targetX-this.x, this.targetY-this.y)<this.speed) { this.isDead=true; pools.push(new BucketPool(this.targetX, this.targetY, this.targetEnemy, this.type)); playEffectSound(breakSound); } }
        draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.spin); let i=this.type===1?fishBucketImg:(this.type===2?snowImg:lavaImg); if(i.complete&&i.naturalWidth>0) ctx.drawImage(i,-42.5,-42.5,85,85); else { ctx.fillStyle=this.type===1?"#4AA0":(this.type===2?"#FFF":"#F40"); ctx.beginPath(); ctx.arc(0,0,42.5,0,Math.PI*2); ctx.fill(); } ctx.restore(); }
    }
    
    class BucketPool {
        constructor(x,y,t,tye) { this.x=x; this.y=y; this.target=t; this.type=tye; this.radius=0; this.life=720; this.pulse=0; this.pixelSize=15; }
        update() {
            this.radius += this.radius<55?3:0.15; this.life--; this.pulse+=0.15; let t=this.target;
            if(t && !t.isDead && !t.isInvincible && this.radius>5 && Math.hypot(t.x-this.x, t.y-this.y) < this.radius+t.radius) {
                if(this.type===1) { t.hp-=0.015; t.poisonTimer=180; } else if(this.type===2) { t.hp-=0.01; t.snowSlowTimer=15; if(t.freezeTimer<=0 && ++t.freezeAccum>55) { t.freezeTimer=120; t.freezeAccum=-40; } } else { t.hp-=0.025; t.burnTimer=180; t.slowTimer=15; }
            }
        }
        draw() {
            if(this.radius<=0.1) return; ctx.save(); ctx.globalAlpha=Math.min(1, this.life/60);
            let cr=Math.max(0.1, this.radius+Math.sin(this.pulse)*2), ps=this.pixelSize, gs=-Math.floor(cr/ps)*ps, ge=Math.floor(cr/ps)*ps;
            for(let px=gs; px<=ge; px+=ps) for(let py=gs; py<=ge; py+=ps) {
                let d=Math.hypot(px,py); if(d<=cr) { let nz=Math.sin(px*0.1+this.pulse)+Math.cos(py*0.1-this.pulse)>0;
                    if(this.type===1) ctx.fillStyle=d<cr*0.3?(nz?"#8F4":"#4A0"):d<cr*0.7?(nz?"#2C4":"#180"):(nz?"#160":"#040");
                    else if(this.type===2) ctx.fillStyle=d<cr*0.3?(nz?"#FFF":"#EEF"):d<cr*0.7?(nz?"#CEF":"#ADF"):(nz?"#8CF":"#5AF");
                    else ctx.fillStyle=d<cr*0.3?(nz?"#FFA":"#FC0"):d<cr*0.7?(nz?"#F80":"#D50"):(nz?"#C20":"#810"); ctx.fillRect(this.x+px, this.y+py, ps, ps);
                }
            } ctx.restore();
        }
    }

    class Ball {
        constructor(x, y, color, darkColor, isBlue) {
            this.x=x; this.y=y; this.isBlue=isBlue; this.dx=isBlue?-defaultSpeed:defaultSpeed; this.dy=(isBlue?-defaultSpeed:defaultSpeed)*0.8;
            this.radius=45; this.color=color; this.darkColor=darkColor; 
            this.hp = isBlue ? 300 : 100;
            this.isDead=false;
            this.electrifiedTimer=0; this.isPinned=false;
            this.angle=Math.atan2(this.dy,this.dx); this.angleToEnemy=0; this.isInvincible=false; this.weapon=null; this.stickState='idle'; this.stickTimer=0; this.stickAngleOffset=Math.PI/4; this.swingTrails=[]; this.freeHandLerp=0; this.isKnockedBack=false; this.bounceCount=0;
            this.poisonTimer=0; this.burnTimer=0; this.slowTimer=0; this.snowSlowTimer=0; this.freezeTimer=0; this.freezeAccum=0; this.activePoisonSound=null; this.activeFreezeSound=null;
            this.triggerAttack = false;
            if (this.isBlue) {
                this.hook = { state: 0, x: this.x, y: this.y, dx: 0, dy: 0, path: [], pauseTimer: 0, life: 0, cooldown: 120 };
                this.hookAngle = Math.random() * Math.PI * 2;
            }
        }
        draw() {
            if(this.isDead) return;
            if(this.weapon==='knockback_stick') {
                let bsa=this.angle+this.stickAngleOffset;
                for(let t of this.swingTrails) { ctx.save(); ctx.globalAlpha=(t.life/15)*0.4; ctx.translate(this.x,this.y); ctx.rotate(t.angle); ctx.translate(0,35); ctx.rotate(Math.PI/4); ctx.drawImage(stickImg,5,-120,110,110); ctx.restore(); }
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(bsa); 
                if(this.stickState==='charging') {
                    let cr=this.stickTimer/180; ctx.shadowColor="#B040FF"; ctx.shadowBlur=15+cr*30; ctx.beginPath(); ctx.arc(80,35,15+Math.random()*25*cr,0,Math.PI*2); ctx.fillStyle=`rgba(180,50,255,${cr*0.8})`; ctx.fill(); ctx.lineWidth=2;
                    for(let i=0;i<5;i++) { let ea=Math.random()*Math.PI*2, ed=70-cr*50; ctx.beginPath(); ctx.moveTo(80+Math.cos(ea)*ed, 35+Math.sin(ea)*ed); ctx.lineTo(80,35); ctx.strokeStyle=`rgba(220,100,255,${Math.random()*cr})`; ctx.stroke(); }
                } else ctx.shadowBlur=0;
                ctx.save(); ctx.translate(0,35); ctx.rotate(Math.PI/4); ctx.drawImage(stickImg,5,-120,110,110); ctx.restore();
                ctx.fillStyle=this.color; ctx.strokeStyle=this.darkColor; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(45,35,12,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(45+(75-45)*this.freeHandLerp, -35+(35+35)*this.freeHandLerp, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore(); 
            }
            ctx.save(); ctx.translate(this.x, this.y); 
            if(this.poisonTimer>0) { ctx.shadowBlur=20; ctx.shadowColor="#4A0"; ctx.fillStyle="rgba(68,170,0,0.4)"; ctx.beginPath(); ctx.arc(0,0,this.radius+6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
            ctx.save(); ctx.rotate(this.angle); ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fillStyle=this.color; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=this.darkColor; ctx.stroke(); ctx.closePath();
            if(this.burnTimer>0 && frameCount%10<5) { ctx.fillStyle="rgba(255,136,0,0.4)"; ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fill(); }
            
            ctx.rotate(-this.angle); ctx.font="14px 'Press Start 2P', cursive"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineWidth=3; ctx.strokeStyle="#000"; let dHp=Math.ceil(Math.max(this.hp,0)); ctx.strokeText(dHp,0,0); ctx.fillStyle="#FFF"; ctx.fillText(dHp,0,0); ctx.restore(); 
            ctx.restore(); 
            
            if(this.electrifiedTimer>0) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.shadowBlur=15; ctx.shadowColor='#ffa'; ctx.strokeStyle='#fff';
                if(Math.random()>0.3) for(let i=0;i<4;i++) {
                    let ow=Math.random()*2+1, cx=(Math.random()-0.5)*this.radius*1.8, cy=(Math.random()-0.5)*this.radius*1.8, p=[{x:cx,y:cy}];
                    for(let j=0;j<3;j++){ cx+=(Math.random()-0.5)*40; cy+=(Math.random()-0.5)*40; p.push({x:cx,y:cy}); }
                    const dl = (w,c) => { ctx.beginPath(); ctx.lineWidth=w; ctx.strokeStyle=c; ctx.moveTo(p[0].x,p[0].y); for(let k=1;k<p.length;k++) ctx.lineTo(p[k].x,p[k].y); ctx.stroke(); };
                    dl(ow,'#fff'); dl(ow*0.45,'#ff0');
                }
                if(Math.random()>0.5){ ctx.globalCompositeOperation="lighter"; ctx.fillStyle="rgba(255,255,100,0.15)"; ctx.beginPath(); ctx.arc(0,0,this.radius+Math.random()*15,0,Math.PI*2); ctx.fill(); } ctx.restore();
            }
            if(this.freezeTimer>0) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.fillStyle="rgba(150,220,255,0.75)"; ctx.strokeStyle="#FFF"; ctx.lineWidth=3; ctx.beginPath(); let r=this.radius+18; ctx.moveTo(0,-r*1.1); ctx.lineTo(r*0.6,-r*0.8); ctx.lineTo(r*1.1,-r*0.2); ctx.lineTo(r*0.9,r*0.5); ctx.lineTo(r*0.5,r*1.1); ctx.lineTo(-r*0.4,r*0.9); ctx.lineTo(-r*1.0,r*0.3); ctx.lineTo(-r*0.8,-r*0.6); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.lineWidth=1.5; ctx.strokeStyle="rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.moveTo(0,-r*1.1); ctx.lineTo(0,0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(r*1.1,-r*0.2); ctx.lineTo(0,0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r*1.0,r*0.3); ctx.lineTo(0,0); ctx.stroke(); ctx.restore();
            }

            if (this.isBlue) {
                let tipOffAngle = this.hookAngle - 0.25; 
                let tipX = this.x + Math.cos(tipOffAngle) * 75; 
                let tipY = this.y + Math.sin(tipOffAngle) * 75;
                
                if (this.hook && this.hook.state !== 0) {
                    ctx.beginPath(); ctx.moveTo(tipX, tipY);
                    for(let i = 0; i < this.hook.path.length; i++) { ctx.lineTo(this.hook.path[i].x, this.hook.path[i].y); }
                    ctx.lineTo(this.hook.x, this.hook.y);
                    ctx.strokeStyle = "#FFF"; ctx.lineWidth = 2; ctx.stroke();
                    ctx.beginPath(); ctx.arc(this.hook.x, this.hook.y, 11, 0, Math.PI * 2);
                    ctx.fillStyle = "#AAA"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#000"; ctx.stroke();
                }

                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.hookAngle);
                ctx.save(); ctx.translate(15, -25); ctx.rotate(Math.PI / 8);
                let rodSize = 85; 
                let img = (this.hook && this.hook.state === 0) ? fishingImg : fishing2Img;
                if (img.complete && img.naturalWidth > 0) { 
                    ctx.rotate(Math.PI / 4); ctx.drawImage(img, 0, -rodSize, rodSize, rodSize); 
                } else { ctx.fillStyle = "#A52A2A"; ctx.fillRect(0, -rodSize, 4, rodSize); }
                ctx.restore(); ctx.restore();
            }
        }
        update(enemy) {
            if(this.hp<=0 && !this.isDead) {
                this.isDead=true; if(this.stickState==='charging') stopCustomSound(chargeSound);
                if(this.activePoisonSound){ this.activePoisonSound.pause(); this.activePoisonSound=null; } if(this.activeFreezeSound){ this.activeFreezeSound.pause(); this.activeFreezeSound=null; }
                createDeathEffect(this.x, this.y, this.color); return; 
            }
            if(this.isDead) return;

            if(enemy && !enemy.isDead) { this.isInvincible=false; }
            else {
                this.angleToEnemy+=0.02; this.isInvincible=true; this.poisonTimer=this.burnTimer=this.slowTimer=this.snowSlowTimer=this.freezeTimer=this.freezeAccum=0;
                if(this.activePoisonSound){ this.activePoisonSound.pause(); this.activePoisonSound.currentTime=0; this.activePoisonSound=null; }
                if(this.activeFreezeSound){ this.activeFreezeSound.pause(); this.activeFreezeSound.currentTime=0; this.activeFreezeSound=null; }
            }

            for(let i=this.swingTrails.length-1; i>=0; i--) if(--this.swingTrails[i].life<=0) this.swingTrails.splice(i,1);
            if(this.poisonTimer>0) {
                this.poisonTimer--; if(!this.isInvincible) this.hp-=0.015;
                if(frameCount%6===0) particles.push({x:this.x+(Math.random()-0.5)*this.radius*1.5, y:this.y+(Math.random()-0.5)*this.radius, dx:(Math.random()-0.5), dy:-1.5-Math.random()*1.5, life:25+Math.random()*10, size:Math.random()*5+3, color:"rgba(68,170,0,0.8)"});
                if(!this.activePoisonSound) { this.activePoisonSound=poisonSound.cloneNode(); this.activePoisonSound.loop=true; this.activePoisonSound.play().catch(e=>{}); }
            } else if(this.activePoisonSound) { this.activePoisonSound.pause(); this.activePoisonSound.currentTime=0; this.activePoisonSound=null; }
            if(this.burnTimer>0) { this.burnTimer--; if(!this.isInvincible) this.hp-=0.02; if(frameCount%15===0) createHitEffect(this.x,this.y,"#F80",0.5); }

                            let pullAngle = Math.atan2(targetY - h.y, targetX - h.x);
                            let distToTarget = Math.hypot(targetX - h.x, targetY - h.y);
                            let pullSpeed = 15;

                                if (h.path.length > 0) { h.x = targetX; h.y = targetY; h.path.pop(); enemy.hp -= 7.0; h.pauseTimer = 10; createHitEffect(h.x, h.y, "#FF4444", 2); playSound('heavyHit'); hitStopTimer = 15; }
                                else {
                                    h.x += Math.cos(pullAngle) * distToTarget; h.y += Math.sin(pullAngle) * distToTarget;

                    }
                } else { this.hookAngle += 0.025; this.hook.state = 0; this.hook.path = []; }

            else if(!this.isPinned && !amIPulled) { 
                let cm = (this.snowSlowTimer>0||this.slowTimer>0)?defaultSpeed*0.45:defaultSpeed;

    function handleBodyCollisions() {
        if (player2.hook && player2.hook.state === 2) return;
        if(player1.isKnockedBack || player2.isKnockedBack) return;
        if(collisionCooldown>0) collisionCooldown--;
        if(!player1.isDead && !player2.isDead) {
            let dx=player2.x-player1.x, dy=player2.y-player1.y, d=Math.hypot(dx,dy)||1;
            if(d < player1.radius+player2.radius) {
                let ov = player1.radius+player2.radius-d, nx=dx/d, ny=dy/d, m1=player1.freezeTimer>0?0.1:1, m2=player2.freezeTimer>0?0.1:1, tm=m1+m2;
                player1.x -= nx*ov*(m2/tm); player1.y -= ny*ov*(m2/tm); player2.x += nx*ov*(m1/tm); player2.y += ny*ov*(m1/tm);
                let van = (player1.dx-player2.dx)*nx + (player1.dy-player2.dy)*ny;
                if(van>0 && collisionCooldown===0) {
                    if(player1.freezeTimer<=0){player1.dx-=van*nx; player1.dy-=van*ny;} if(player2.freezeTimer<=0){player2.dx+=van*nx; player2.dy+=van*ny;}
                    player1.hp-=COLLISION_DMG; createHitEffect(player1.x, player1.y); player2.hp-=COLLISION_DMG; createHitEffect(player2.x, player2.y);
                    playSound('bounce'); collisionCooldown=5; 
                }
            }
        }

    const getTags = p => {

        if(p.stickState==='cooldown') t.push(`<span style='color:#FFaa00'>[CD: ${Math.ceil((600-p.stickTimer)/60)}s]</span>`);
        if(p.isKnockedBack) t.push(`<span style='color:#FF0000'>[FLYING: ${p.bounceCount}]</span>`);
        if(p.electrifiedTimer>0) t.push("<span style='color:#FF0'>[ELECTRIFIED]</span>"); if(p.poisonTimer>0) t.push("<span style='color:#8F4'>[POISON]</span>");

    function updateLogic() {
        if(isStarted && startDelayTimer>0) { startDelayTimer--; if(startDelayTimer === 0) { gameStartTime = performance.now(); playCustomSound(fightSound); } return; }
        frameCount++;
        if (shareStatusTimer > 0) shareStatusTimer--;
        if(hitStopTimer>0) hitStopTimer--;

            for(let i=projectiles.length-1; i>=0; i--) { projectiles[i].update(); if(projectiles[i].isDead) projectiles.splice(i,1); }
            for(let i=pools.length-1; i>=0; i--) { pools[i].update(); if(pools[i].life<=0) pools.splice(i,1); }
            player1.update(player2); player2.update(player1); handleBodyCollisions();
        }
        for(let i=particles.length-1; i>=0; i--) { let p=particles[i]; p.x+=p.dx; p.y+=p.dy; p.life--; if(p.life<=0) particles.splice(i,1); }

            isGameOver = true; finalClearTime = performance.now() - gameStartTime; isWin = player2.isDead && !player1.isDead;

            const my = (e.clientY - rect.top) * scaleY;

            if (
                mx >= shareButtonBounds.x &&
                mx <= shareButtonBounds.x + shareButtonBounds.w &&
                my >= shareButtonBounds.y &&
                my <= shareButtonBounds.y + shareButtonBounds.h
            ) {
                shareRecordToDiscord();
                return;
            }
        }

        if (isStarted && isGameOver) {
            resetGame();
        }
    });

    const asciiText = `     #####      #####      #####      #####      ####    ##   ##   ##   ##   ####        ##      ######    ####      #####      ##   ## 
 ##   ##    ##   ##    ##   ##    ##   ##      ##     ### ###   ##   ##    ##        ####      # ## #      ##     ##   ##    ###  ## 
 ##   ##    ##   ##    ##   ##    ##            ##     #######   ##   ##    ##       ##  ##      ##        ##     ##   ##    #### ## 
 ##   ##    ##   ##    ##   ##     #####        ##     #######   ##   ##    ##       ######      ##        ##     ##   ##     ## #### 
 ##   ##    ##   ##    ##   ##          ##      ##     ## # ##   ##   ##    ##   #   ##  ##      ##        ##     ##   ##     ##  ### 
 ##   ##    ##   ##    ##   ##    ##   ##      ##     ##   ##   ##   ##    ##  ##   ##  ##      ##        ##     ##   ##     ##   ## 
  #####      #####      #####      #####      ####    ##   ##    #####    #######   ##  ##     ####      ####      #####      ##   ## `;
    const asciiLogo = document.getElementById('asciiLogo');
    const glitchChars = ['#', '@', '%', '&', '*', '+', '?', 'X'];
    const targets = [];
    function buildAscii() { if(!asciiLogo) return; asciiLogo.innerHTML = ''; targets.length = 0; for (const ch of asciiText) { if (ch === '\n') { asciiLogo.appendChild(document.createTextNode('\n')); continue; } const span = document.createElement('span'); span.className = 'ascii-char'; span.textContent = ch; span.dataset.original = ch; asciiLogo.appendChild(span); if (ch !== ' ') targets.push(span); } }
    function glitchOne() { if (window.innerWidth <= 480 || !targets.length) return; const target = targets[Math.floor(Math.random() * targets.length)]; const original = target.dataset.original; target.textContent = glitchChars[Math.floor(Math.random() * glitchChars.length)]; target.classList.add('glitching'); setTimeout(() => { target.textContent = original; target.classList.remove('glitching'); }, 120); }
    buildAscii();
    setInterval(() => { const times = Math.random() < 0.5 ? 2 : 4; for (let i = 0; i < times; i++) setTimeout(glitchOne, i * 60); }, 100);
  </script>
</body>
