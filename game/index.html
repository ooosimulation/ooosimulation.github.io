<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooosimulation - Discord</title>
  <link rel="icon" type="image/png" href="../favicon2.png">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  </style>

  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      color: white;
      text-align: center;
      min-height: 100vh;
      background-color: #030712;
      background-image:
        radial-gradient(circle at 7% 12%, rgba(255,255,255,0.95) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 78%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 29% 25%, rgba(255,255,255,0.9) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 41% 66%, rgba(255,255,255,0.7) 0 1px, transparent 1.6px),
        radial-gradient(circle at 52% 14%, rgba(255,255,255,0.85) 0 1.3px, transparent 1.8px),
        radial-gradient(circle at 63% 82%, rgba(255,255,255,0.8) 0 1px, transparent 1.6px),
        radial-gradient(circle at 74% 31%, rgba(255,255,255,0.95) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 86% 58%, rgba(255,255,255,0.72) 0 1px, transparent 1.6px),
        radial-gradient(circle at 93% 17%, rgba(255,255,255,0.88) 0 1.1px, transparent 1.7px),
        radial-gradient(circle at 11% 50%, rgba(173,216,255,0.35) 0 2px, transparent 4px),
        radial-gradient(circle at 79% 9%, rgba(173,216,255,0.25) 0 2px, transparent 4px),
        radial-gradient(circle at 50% 50%, rgba(53, 80, 160, 0.18), transparent 55%),
        linear-gradient(to bottom, #02040a 0%, #081225 45%, #101a3a 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container { width: 100%; max-width: 550px; padding: 10px; position: relative; z-index: 2; }

    /* ==== 게임 전용 CSS ==== */
    #gameWrapper { 
        width: 100%; background-color: #000;
        border: 4px solid #FFF; border-radius: 10px;
        box-shadow: 0 0 20px rgba(255,255,255,0.15);
        overflow: hidden; position: relative;
    }
    #titleBar { 
        width: 100%; display: flex; justify-content: space-around; align-items: center; 
        background-color: #000; padding: 15px 0; border-bottom: 2px solid #555; 
    }
    .title-left { font-size: 16px; color: #22CC44; } 
    .title-vs { font-size: 12px; color: #FFFFFF; }
    .title-right { font-size: 16px; color: #88CCFF; } 
    
    #gameCanvas { background-color: #000; display: block; width: 100%; height: auto; aspect-ratio: 1/1; cursor: crosshair; }
    
    #statusBar { 
        width: 100%; padding: 15px 10px 10px; border-top: 2px solid #555; 
        color: #FFF; font-size: 9px; line-height: 1.5; box-sizing: border-box;
    }
    .status-hp { font-size: 11px; margin-bottom: 5px; }

    #startOverlay { 
        position: absolute; top: 50px; left: 0; width: 100%; height: calc(100% - 100px); 
        background-color: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; 
        align-items: center; justify-content: center; z-index: 10; cursor: pointer;
    }
    .start-text { color: #FFF; font-size: 18px; }
    .controls-info { color: #AAFFAA; font-size: 11px; margin-top: 20px; line-height: 1.8; }
  </style>

  <script type="module">
    import { DiscordSDK } from "https://esm.sh/@discord/embedded-app-sdk";
    const discordSdk = new DiscordSDK("1492558716027797574");
    async function setupDiscord() {
      await discordSdk.ready();
    }
    setupDiscord();
  </script>
</head>
<body>
  <div class="container">
    <div id="gameWrapper">
        <div id="titleBar">
            <div class="title-left">STICK (YOU)</div>
            <div class="title-vs">VS</div>
            <div class="title-right">ANGLER (CPU)</div>
        </div>
        <div id="startOverlay">
            <div class="start-text">CLICK TO START</div>
            <div class="controls-info">[WASD]: Move<br>[J]: Attack</div>
        </div>
        <canvas id="gameCanvas" width="550" height="550"></canvas>
        <div id="statusBar"></div>
    </div>
  </div>

  <script>
    // ===== GAME SCRIPT =====
    const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
    
    // 경로 수정: game 폴더 안이므로 상위 폴더(..)의 파일을 가져옴
    const loadImg = s => { let i = new Image(); i.src = "../" + s; return i; };
    const stickImg = loadImg("knockback stick.gif"), fishBucketImg = loadImg('fish bucket.png'), 
          snowImg = loadImg('snow.png'), lavaImg = loadImg('lava.png'),
          fishingImg = loadImg('fishing.png'), fishing2Img = loadImg('fishing2.png');
    
    const loadSnd = s => new Audio("../" + s);
    const chargeSound = loadSnd("spear charging.mp3"), hitSound = loadSnd("baseball.mp3"), 
          swingSound = loadSnd("swing.mp3"), throwSound = loadSnd("through2.mp3"), 
          breakSound = loadSnd("break2.mp3"), poisonSound = loadSnd("poison.mp3"), 
          freezeSound = loadSnd("freeze.mp3"), readySound = loadSnd("ready.mp3"), 
          fightSound = loadSnd("fight.mp3"), anglerMp3 = loadSnd('angler.mp3');

    // --- 이하 원본 로직 유지 (기존 사용자 코드를 여기에 통합) ---
    let audioCtx;
    const playCustomSound = o => { if(o){ o.currentTime=0; o.play().catch(e=>{}); } };
    const stopCustomSound = o => { if(o){ o.pause(); o.currentTime=0; } };
    const playEffectSound = o => { if(o){ let c = o.cloneNode(true); c.volume=1.0; c.play().catch(e=>{}); } };
    const initAudio = () => { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

    function playSound(type) {
        if(!audioCtx) return null;
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), t = audioCtx.currentTime;
        const setS = (ty, f1, f2, g1, g2, d) => { osc.type=ty; osc.frequency.setValueAtTime(f1,t); osc.frequency.exponentialRampToValueAtTime(f2,t+d); gain.gain.setValueAtTime(g1,t); gain.gain.exponentialRampToValueAtTime(g2,t+d); };
        if(type==='hit') setS("sawtooth", 250, 50, 0.2, 0.01, 0.1);
        else if(type==='bounce') setS("sine", 200, 80, 0.05, 0.001, 0.1);
        else if(type==='heavyHit') setS("sawtooth", 120, 10, 0.5, 0.01, 0.4);
        else if(type==='death') setS("square", 100, 10, 0.3, 0.01, 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(t+0.5); return null;
    }

    const defaultSpeed = 2.5, COLLISION_DMG = 0.7; 
    let frameCount = 0, particles = [], projectiles = [], pools = [], hitStopTimer = 0, collisionCooldown = 0; 
    let isStarted = false, startDelayTimer = 250, lastTime = 0, accumulator = 0;
    const logicStep = 1000 / 165;
    let isGameOver = false, isWin = false, gameStartTime = 0, finalClearTime = 0;
    const keys = { w: false, a: false, s: false, d: false };

    const formatTime = ms => {
        let t = Math.floor(ms), m = Math.floor(t / 60000).toString().padStart(2, '0');
        let s = Math.floor((t % 60000) / 1000).toString().padStart(2, '0');
        let msPart = Math.floor((t % 1000) / 10).toString().padStart(2, '0');
        return `${m}:${s}.${msPart}`;
    };

    const spawnP = (x, y, c, sm, isD) => {
        let cnt = isD ? 50 : 20 * sm; if(isD) playSound('death');
        for(let i=0; i<cnt; i++) particles.push({ x, y, dx:(Math.random()-0.5)*(isD?15:12*sm), dy:(Math.random()-0.5)*(isD?15:12*sm), life:(isD?40:20)+Math.random()*(isD?30:15*sm), size:(Math.random()*(isD?6:4)+2)*sm, color:c||"#FFF" });
    };

    class BucketProjectile {
        constructor(sx,sy,tx,ty,t,tye) { this.x=sx; this.y=sy; this.targetX=tx; this.targetY=ty; this.targetEnemy=t; this.type=tye; let a=Math.atan2(ty-sy,tx-sx); this.speed=5; this.dx=Math.cos(a)*5; this.dy=Math.sin(a)*5; this.spin=0; this.isDead=false; }
        update() { this.x+=this.dx; this.y+=this.dy; this.spin+=0.2; if(Math.hypot(this.targetX-this.x, this.targetY-this.y)<this.speed) { this.isDead=true; pools.push(new BucketPool(this.targetX, this.targetY, this.targetEnemy, this.type)); playEffectSound(breakSound); } }
        draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.spin); let i=this.type===1?fishBucketImg:(this.type===2?snowImg:lavaImg); if(i.complete) ctx.drawImage(i,-42.5,-42.5,85,85); ctx.restore(); }
    }
    
    class BucketPool {
        constructor(x,y,t,tye) { this.x=x; this.y=y; this.target=t; this.type=tye; this.radius=0; this.life=720; this.pulse=0; this.pixelSize=15; }
        update() {
            this.radius += this.radius<55?3:0.15; this.life--; this.pulse+=0.15; let t=this.target;
            if(t && !t.isDead && !t.isInvincible && this.radius>5 && Math.hypot(t.x-this.x, t.y-this.y) < this.radius+t.radius) {
                if(this.type===1) { t.hp-=0.015; t.poisonTimer=180; } else if(this.type===2) { t.hp-=0.01; t.snowSlowTimer=15; if(t.freezeTimer<=0 && ++t.freezeAccum>55) { t.freezeTimer=120; t.freezeAccum=-40; } } else { t.hp-=0.025; t.burnTimer=180; t.slowTimer=15; }
            }
        }
        draw() {
            if(this.radius<=0.1) return; ctx.save(); ctx.globalAlpha=Math.min(1, this.life/60);
            let cr=Math.max(0.1, this.radius+Math.sin(this.pulse)*2), ps=this.pixelSize;
            for(let px=-cr; px<=cr; px+=ps) for(let py=-cr; py<=cr; py+=ps) {
                if(Math.hypot(px,py)<=cr) {
                    if(this.type===1) ctx.fillStyle="#4A0"; else if(this.type===2) ctx.fillStyle="#CEF"; else ctx.fillStyle="#F80";
                    ctx.fillRect(this.x+px, this.y+py, ps, ps);
                }
            } ctx.restore();
        }
    }

    class Ball {
        constructor(x, y, color, darkColor, isBlue) {
            this.x=x; this.y=y; this.isBlue=isBlue; this.dx=isBlue?-defaultSpeed:defaultSpeed; this.dy=(isBlue?-defaultSpeed:defaultSpeed)*0.8;
            this.radius=45; this.color=color; this.darkColor=darkColor; this.hp = isBlue ? 300 : 100;
            this.isDead=false; this.angle=Math.atan2(this.dy,this.dx); this.angleToEnemy=0; this.isInvincible=false; this.weapon=null;
            this.stickState='idle'; this.stickTimer=0; this.stickAngleOffset=Math.PI/4; this.swingTrails=[]; this.freeHandLerp=0; this.isKnockedBack=false; this.bounceCount=0;
            this.poisonTimer=0; this.burnTimer=0; this.slowTimer=0; this.snowSlowTimer=0; this.freezeTimer=0; this.freezeAccum=0;
            this.triggerAttack = false;
            if (this.isBlue) { this.hook = { state: 0, x: this.x, y: this.y, dx: 0, dy: 0, path: [], pauseTimer: 0, life: 0, cooldown: 120 }; this.hookAngle = Math.random() * Math.PI * 2; }
        }
        draw() {
            if(this.isDead) return;
            if(this.weapon==='knockback_stick') {
                let bsa=this.angle+this.stickAngleOffset;
                for(let t of this.swingTrails) { ctx.save(); ctx.globalAlpha=(t.life/15)*0.4; ctx.translate(this.x,this.y); ctx.rotate(t.angle); ctx.translate(0,35); ctx.rotate(Math.PI/4); ctx.drawImage(stickImg,5,-120,110,110); ctx.restore(); }
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(bsa); 
                if(this.stickState==='charging') {
                    let cr=this.stickTimer/180; ctx.shadowColor="#B040FF"; ctx.shadowBlur=15+cr*30; ctx.beginPath(); ctx.arc(80,35,15+Math.random()*25*cr,0,Math.PI*2); ctx.fillStyle=`rgba(180,50,255,${cr*0.8})`; ctx.fill();
                }
                ctx.save(); ctx.translate(0,35); ctx.rotate(Math.PI/4); ctx.drawImage(stickImg,5,-120,110,110); ctx.restore();
                ctx.fillStyle=this.color; ctx.strokeStyle=this.darkColor; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(45,35,12,0,Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(45+(75-45)*this.freeHandLerp, -35+(35+35)*this.freeHandLerp, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore(); 
            }
            ctx.save(); ctx.translate(this.x, this.y);
            if(this.poisonTimer>0) { ctx.fillStyle="rgba(68,170,0,0.4)"; ctx.beginPath(); ctx.arc(0,0,this.radius+6,0,Math.PI*2); ctx.fill(); }
            ctx.rotate(this.angle); ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fillStyle=this.color; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=this.darkColor; ctx.stroke();
            ctx.rotate(-this.angle); ctx.font="14px 'Press Start 2P', cursive"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.strokeStyle="#000"; let dHp=Math.ceil(Math.max(this.hp,0)); ctx.strokeText(dHp,0,0); ctx.fillStyle="#FFF"; ctx.fillText(dHp,0,0); ctx.restore();

            if (this.isBlue && this.hook && this.hook.state !== 0) {
              ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.hook.x, this.hook.y); ctx.strokeStyle = "#FFF"; ctx.lineWidth = 2; ctx.stroke();
              ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.hookAngle); ctx.drawImage(this.hook.state === 0 ? fishingImg : fishing2Img, 15, -110, 85, 85); ctx.restore();
            }
        }
        update(enemy) {
            if(this.hp<=0 && !this.isDead) { this.isDead=true; spawnP(this.x, this.y, this.color, 1, true); return; }
            if(this.isDead) return;

            if(!this.isBlue && !this.isKnockedBack && this.freezeTimer <= 0) {
                let ax = 0, ay = 0;
                if (keys.w) ay -= defaultSpeed; if (keys.s) ay += defaultSpeed;
                if (keys.a) ax -= defaultSpeed; if (keys.d) ax += defaultSpeed;
                this.dx = ax; this.dy = ay;
                if(enemy) this.angle = Math.atan2(enemy.y-this.y, enemy.x-this.x);
                
                if (this.weapon === 'knockback_stick') {
                    if (this.triggerAttack && this.stickState === 'idle') { this.stickState = 'charging'; this.stickTimer = 0; playCustomSound(chargeSound); this.triggerAttack = false; }
                    if (this.stickState === 'charging') { this.stickTimer++; if (this.stickTimer > 150) { this.stickState = 'swinging'; this.stickTimer = 0; stopCustomSound(chargeSound); playCustomSound(swingSound); } }
                    if (this.stickState === 'swinging') { 
                        this.stickTimer++; 
                        this.stickAngleOffset = -Math.PI/4 + (Math.PI) * Math.sin((this.stickTimer/12)*Math.PI/2);
                        if(this.stickTimer === 6 && enemy && Math.hypot(enemy.x-this.x, enemy.y-this.y)<160) {
                            enemy.hp-=15; enemy.isKnockedBack=true; enemy.bounceCount=5; enemy.dx=Math.cos(this.angle)*25; enemy.dy=Math.sin(this.angle)*25;
                            playCustomSound(hitSound); hitStopTimer=15;
                        }
                        if(this.stickTimer >= 12) this.stickState='idle';
                    }
                }
            }
            if(this.isBlue) {
              // AI 로직 (간략화)
              this.x += this.dx; this.y += this.dy;
              if(this.x<this.radius || this.x>canvas.width-this.radius) this.dx*=-1;
              if(this.y<this.radius || this.y>canvas.height-this.radius) this.dy*=-1;
              if(enemy) this.angle = Math.atan2(enemy.y-this.y, enemy.x-this.x);
            } else { this.x += this.dx; this.y += this.dy; }
        }
    }

    let player1 = new Ball(100, 275, "#22CC44", "#147A28", false); player1.weapon = 'knockback_stick';
    let player2 = new Ball(450, 275, "#88CCFF", "#4488CC", true);

    function updateLogic() {
        if(!isStarted) return;
        if(startDelayTimer > 0) { startDelayTimer--; if(startDelayTimer===0) { gameStartTime=performance.now(); playCustomSound(fightSound); } return; }
        if(hitStopTimer>0) { hitStopTimer--; return; }
        player1.update(player2); player2.update(player1);
        for(let p of particles) { p.x+=p.dx; p.y+=p.dy; p.life--; }
        particles = particles.filter(p => p.life > 0);

        if((player1.isDead || player2.isDead) && !isGameOver) {
          isGameOver=true; finalClearTime=performance.now()-gameStartTime;
        }
    }

    function renderGraphics() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        player2.draw(); player1.draw();
        for(let p of particles) { ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(p.life/30), 0, Math.PI*2); ctx.fillStyle=p.color; ctx.fill(); }
        
        if(!isStarted) return;
        if(startDelayTimer > 0) {
            ctx.fillStyle="#FFF"; ctx.font="20px 'Press Start 2P', cursive"; ctx.textAlign="center"; ctx.fillText("READY...", canvas.width/2, canvas.height/2);
        }
        if(isGameOver) {
          ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle="#FFF"; ctx.font="30px 'Press Start 2P', cursive"; ctx.textAlign="center"; 
          ctx.fillText(player2.isDead ? "YOU WIN!" : "GAME OVER", canvas.width/2, canvas.height/2);
        }
        let pt1 = player1.isDead ? "DEAD" : Math.ceil(player1.hp), pt2 = player2.isDead ? "DEAD" : Math.ceil(player2.hp);
        document.getElementById("statusBar").innerHTML = `<div class="status-hp">STICK: ${pt1} | ANGLER: ${pt2}</div>`;
    }

    function animate(currentTime) {
        if (!lastTime) lastTime = currentTime;
        let deltaTime = currentTime - lastTime; lastTime = currentTime; accumulator += deltaTime;
        while (accumulator >= logicStep) { updateLogic(); accumulator -= logicStep; }
        renderGraphics(); requestAnimationFrame(animate);
    }

    window.addEventListener('keydown', e => { let k = e.key.toLowerCase(); if(['w','a','s','d'].includes(k)) keys[k]=true; if(k==='j') player1.triggerAttack=true; });
    window.addEventListener('keyup', e => { let k = e.key.toLowerCase(); if(['w','a','s','d'].includes(k)) keys[k]=false; });
    document.getElementById("startOverlay").addEventListener('click', function() {
        if(!isStarted) { this.style.display="none"; isStarted=true; initAudio(); playCustomSound(readySound); requestAnimationFrame(animate); }
        else if(isGameOver) location.reload();
    });
  </script>
</body>
</html>
