<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooosimulation - Discord Game</title>
  <link rel="icon" type="image/png" href="../favicon2.png">
  
  <style>
    /* 1. 디스코드 보안 우회를 위해 CDN 주소를 살짝 변경하여 로드 */
    @font-face {
      font-family: 'Press Start 2P';
      src: url('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/pressstart2p/PressStart2P-Regular.ttf') format('truetype');
      font-display: swap;
    }

    /* 2. 모든 요소에 최우선적으로 폰트 적용 */
    * {
      font-family: 'Press Start 2P', cursive !important;
    }

    body {
      margin: 0;
      color: white;
      text-align: center;
      min-height: 100vh;
      background-color: #030712;
      background-image:
        radial-gradient(circle at 7% 12%, rgba(255,255,255,0.95) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 78%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 29% 25%, rgba(255,255,255,0.9) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 41% 66%, rgba(255,255,255,0.7) 0 1px, transparent 1.6px),
        radial-gradient(circle at 52% 14%, rgba(255,255,255,0.85) 0 1.3px, transparent 1.8px),
        radial-gradient(circle at 63% 82%, rgba(255,255,255,0.8) 0 1px, transparent 1.6px),
        radial-gradient(circle at 74% 31%, rgba(255,255,255,0.95) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 86% 58%, rgba(255,255,255,0.72) 0 1px, transparent 1.6px),
        radial-gradient(circle at 93% 17%, rgba(255,255,255,0.88) 0 1.1px, transparent 1.7px),
        radial-gradient(circle at 11% 50%, rgba(173,216,255,0.35) 0 2px, transparent 4px),
        radial-gradient(circle at 79% 9%, rgba(173,216,255,0.25) 0 2px, transparent 4px),
        radial-gradient(circle at 50% 50%, rgba(53, 80, 160, 0.18), transparent 55%),
        linear-gradient(to bottom, #02040a 0%, #081225 45%, #101a3a 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container { width: 100%; max-width: 550px; padding: 10px; position: relative; z-index: 2; }

    #gameWrapper { 
        width: 100%; max-width: 550px; 
        background-color: #000;
        border: 4px solid #FFF; 
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(255,255,255,0.15);
        overflow: hidden; 
        position: relative;
    }
    #gameContainer { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
    #titleBar { width: 100%; display: flex; justify-content: space-around; align-items: center; background-color: #000; padding: 15px 0; border-bottom: 2px solid #555; letter-spacing: 1px; }
    .title-left { font-size: 18px; color: #22CC44; text-shadow: 2px 2px 0 #000; } 
    .title-vs { font-size: 14px; color: #FFFFFF; }
    .title-right { font-size: 18px; color: #88CCFF; text-shadow: 2px 2px 0 #000; } 
    #gameCanvas { background-color: #000; display: block; width: 100%; height: auto; aspect-ratio: 1/1; cursor: crosshair; border: none; }
    #statusBar { width: 100%; padding: 15px 10px 10px; border-top: 2px solid #555; color: #FFF; text-align: center; display: flex; flex-direction: column; line-height: 1.5; box-sizing: border-box; }
    .status-hp { font-size: 11px; margin-bottom: 5px; text-shadow: 1px 1px 0 #000; }
    .status-effects { font-size: 9px; color: #CCC; }
    #startOverlay { position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 115px); background-color: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
    .start-text { color: #FFF; font-size: 18px; text-align: center; line-height: 1.5; }
    .start-sub { color: #BBB; font-size: 12px; margin-top: 20px; text-align: center; }
    .controls-info { color: #AAFFAA; font-size: 12px; margin-top: 30px; line-height: 2; background-color: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; }
  </style>

  <script type="module">
    import { DiscordSDK } from "https://esm.sh/@discord/embedded-app-sdk";
    const discordSdk = new DiscordSDK("1492558716027797574");
    async function setupDiscord() {
      await discordSdk.ready();
    }
    setupDiscord();
  </script>
</head>
<body>
  <div class="container">
    <div id="gameWrapper">
      <div id="gameContainer">
          <div id="titleBar">
              <div class="title-left">STICK (YOU)</div>
              <div class="title-vs">VS</div>
              <div class="title-right">ANGLER (CPU)</div>
          </div>
          <div id="startOverlay">
              <div class="start-text">CLICK TO START</div>
              <div class="start-sub">Stick VS Angler</div>
              <div class="controls-info">[WASD]: Move<br><br>[J]: Auto-Charge Attack</div>
          </div>
          <canvas id="gameCanvas" width="550" height="550"></canvas>
          <div id="statusBar"></div>
      </div>
    </div>
  </div>

  <script>
    // [이미지/사운드 로드 및 게임 로직 시작 - 기존 코드와 동일]
    const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
    const loadImg = s => { let i = new Image(); i.src = "../" + s; return i; };
    const stickImg = loadImg("knockback stick.gif"), fishBucketImg = loadImg('fish bucket.png'), snowImg = loadImg('snow.png'), lavaImg = loadImg('lava.png');
    const fishingImg = loadImg('fishing.png'), fishing2Img = loadImg('fishing2.png');
    const loadSnd = s => new Audio("../" + s);
    const chargeSound = loadSnd("spear charging.mp3"), hitSound = loadSnd("baseball.mp3"), swingSound = loadSnd("swing.mp3"), throwSound = loadSnd("through2.mp3"), breakSound = loadSnd("break2.mp3"), poisonSound = loadSnd("poison.mp3"), freezeSound = loadSnd("freeze.mp3");
    const anglerMp3 = loadSnd('angler.mp3'), readySound = loadSnd("ready.mp3"), fightSound = loadSnd("fight.mp3");

    // ... (이하 모든 자바스크립트 게임 로직 동일) ...
    // [사용자님의 원본 로직이 이 아래로 길게 이어집니다]
    // 용량상 생략하지만, 실제 파일에는 전체 로직을 그대로 두시면 됩니다.

    // 중략... (Ball 클래스, updateLogic, renderGraphics 등)

    // 애니메이션 실행부
    const animate = (currentTime) => {
        if (!lastTime) lastTime = currentTime;
        let deltaTime = currentTime - lastTime; lastTime = currentTime; if (deltaTime > 250) deltaTime = 250; accumulator += deltaTime;
        while (accumulator >= logicStep) { updateLogic(); accumulator -= logicStep; }
        renderGraphics(); animationId = requestAnimationFrame(animate);
    };

    window.addEventListener('keydown', e => {
        let k = e.key.toLowerCase(); if(['w','a','s','d'].includes(k)) keys[k] = true;
        if (k === 'j') {
            const overlay = document.getElementById("startOverlay");
            if (overlay && overlay.offsetParent !== null) { if (!isStarted) { overlay.style.display = "none"; isStarted = true; initAudio(); lastTime = performance.now(); startDelayTimer = 250; playCustomSound(readySound); if(!animationId) animationId = requestAnimationFrame(animate); } else { if(player1.stickState === 'idle' && !isGameOver) player1.triggerAttack = true; } }
            else if (isStarted) { if (!isGameOver && player1.stickState === 'idle') { player1.triggerAttack = true; } }
        }
    });
    window.addEventListener('keyup', e => { let k = e.key.toLowerCase(); if(['w','a','s','d'].includes(k)) keys[k] = false; });
    document.getElementById("startOverlay").addEventListener('click', function(e) { if(!isStarted) { e.preventDefault(); this.style.display = "none"; isStarted = true; initAudio(); lastTime = performance.now(); startDelayTimer = 250; playCustomSound(readySound); if(!animationId) animationId = requestAnimationFrame(animate); } });
    canvas.addEventListener('click', () => { if (isStarted && isGameOver) { resetGame(); } });

    // 아스키 로고 애니메이션
    const asciiText = `     #####      #####      #####      #####      ####    ##   ##   ##   ##   ####        ##      ######    ####      #####      ##   ## 
 ##   ##    ##   ##    ##   ##    ##   ##      ##     ### ###   ##   ##    ##        ####      # ## #      ##     ##   ##    ###  ## 
 ##   ##    ##   ##    ##   ##    ##            ##     #######   ##   ##    ##       ##  ##      ##        ##     ##   ##    #### ## 
 ##   ##    ##   ##    ##   ##     #####        ##     #######   ##   ##    ##       ######      ##        ##     ##   ##     ## #### 
 ##   ##    ##   ##    ##   ##          ##      ##     ## # ##   ##   ##    ##   #   ##  ##      ##        ##     ##   ##     ##  ### 
 ##   ##    ##   ##    ##   ##    ##   ##      ##     ##   ##   ##   ##    ##  ##   ##  ##      ##        ##     ##   ##     ##   ## 
  #####      #####      #####      #####      ####    ##   ##    #####    #######   ##  ##     ####      ####      #####      ##   ## `;
    const asciiLogo = document.getElementById('asciiLogo');
    const glitchChars = ['#', '@', '%', '&', '*', '+', '?', 'X'];
    const targets = [];
    function buildAscii() { if(!asciiLogo) return; asciiLogo.innerHTML = ''; targets.length = 0; for (const ch of asciiText) { if (ch === '\n') { asciiLogo.appendChild(document.createTextNode('\n')); continue; } const span = document.createElement('span'); span.className = 'ascii-char'; span.textContent = ch; span.dataset.original = ch; asciiLogo.appendChild(span); if (ch !== ' ') targets.push(span); } }
    function glitchOne() { if (window.innerWidth <= 480 || !targets.length) return; const target = targets[Math.floor(Math.random() * targets.length)]; const original = target.dataset.original; target.textContent = glitchChars[Math.floor(Math.random() * glitchChars.length)]; target.classList.add('glitching'); setTimeout(() => { target.textContent = original; target.classList.remove('glitching'); }, 120); }
    buildAscii();
    setInterval(() => { const times = Math.random() < 0.5 ? 2 : 4; for (let i = 0; i < times; i++) setTimeout(glitchOne, i * 60); }, 100);
  </script>
</body>
</html>
